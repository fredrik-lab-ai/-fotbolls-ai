<body>

<div class="box">

<h1>⚽ Fotbolls-AI<br>Backtest V6</h1>

<p class="small">
V6 är en diagnostisk version. Den försöker först hitta
hur ofta modellen faktiskt skiljer sig från marknaden och
om dessa signaler har historiskt värde.
</p>

<label>Första säsong</label>
<select id="from">
<option value="2018" selected>2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025">2025/26</option>
</select>

<label>Sista säsong</label>
<select id="to">
<option value="2018">2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025" selected>2025/26</option>
</select>

<button id="run" onclick="runV6()">
KÖR V6-ANALYS
</button>

<div id="status">Redo.</div>
<div id="result"></div>

</div>

<script>

const DATA_BASE="data/";

const seasons={
2018:"1819",
2019:"1920",
2020:"2021",
2021:"2122",
2022:"2223",
2023:"2324",
2024:"2425",
2025:"2526"
};


/* =====================================================
CSV
===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quote=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];
    const n=text[i+1];

    if(c==='"'){

      if(quote && n==='"'){
        cell+='"';
        i++;
      }else{
        quote=!quote;
      }

    }else if(c===',' && !quote){

      row.push(cell.trim());
      cell="";

    }else if((c==='\n'||c==='\r')&&!quote){

      if(c==='\r'&&n==='\n')i++;

      row.push(cell.trim());
      cell="";

      if(row.some(x=>x!=="")){
        rows.push(row);
      }

      row=[];

    }else{

      cell+=c;

    }

  }

  if(row.length||cell){

    row.push(cell.trim());

    if(row.some(x=>x!=="")){
      rows.push(row);
    }

  }

  if(!rows.length)return[];

  const headers=rows[0];

  return rows.slice(1).map(r=>{

    const o={};

    headers.forEach((h,i)=>{
      o[h]=r[i]||"";
    });

    return o;

  });
}


/* =====================================================
HJÄLP
===================================================== */

function num(v){

  if(v===undefined||v===null||v===""){
    return null;
  }

  const n=parseFloat(
    String(v).replace(",",".")
  );

  return Number.isFinite(n)?n:null;
}


function dateSort(v){

  if(!v)return 0;

  const p=String(v).split("/");

  if(p.length===3){

    let d=parseInt(p[0]);
    let m=parseInt(p[1]);
    let y=parseInt(p[2]);

    if(y<100)y+=2000;

    return new Date(y,m-1,d).getTime();

  }

  return new Date(v).getTime()||0;
}


/* =====================================================
ODDS
===================================================== */

function getOdds(row){

  const h=
    num(row.B365H) ??
    num(row.BWH) ??
    num(row.WHH) ??
    num(row.AvgH);

  const d=
    num(row.B365D) ??
    num(row.BWD) ??
    num(row.WHD) ??
    num(row.AvgD);

  const a=
    num(row.B365A) ??
    num(row.BWA) ??
    num(row.WHA) ??
    num(row.AvgA);

  if(h===null||d===null||a===null){
    return null;
  }

  if(h<=1||d<=1||a<=1){
    return null;
  }

  const ih=1/h;
  const id=1/d;
  const ia=1/a;

  const sum=ih+id+ia;

  return{
    odds:[h,d,a],
    probabilities:[
      ih/sum,
      id/sum,
      ia/sum
    ]
  };
}


/* =====================================================
POISSON
===================================================== */

function poisson(k,l){

  let p=Math.exp(-l);

  for(let i=1;i<=k;i++){
    p*=l/i;
  }

  return p;
}


function modelProb(hLambda,aLambda){

  let h=0;
  let d=0;
  let a=0;

  for(let hg=0;hg<=10;hg++){

    for(let ag=0;ag<=10;ag++){

      const p=
        poisson(hg,hLambda)*
        poisson(ag,aLambda);

      if(hg>ag)h+=p;
      else if(hg===ag)d+=p;
      else a+=p;

    }

  }

  const total=h+d+a;

  return[
    h/total,
    d/total,
    a/total
  ];
}


/* =====================================================
TEAMSTATISTIK
===================================================== */

function addTeam(stats,team,gf,ga){

  if(!stats[team]){

    stats[team]={
      gf:0,
      ga:0,
      n:0,
      recent:[]
    };

  }

  stats[team].gf+=gf;
  stats[team].ga+=ga;
  stats[team].n++;

  stats[team].recent.push({
    gf,
    ga
  });

  if(stats[team].recent.length>10){
    stats[team].recent.shift();
  }

}


/* =====================================================
FORM
===================================================== */

function formStats(team){

  if(!team||!team.recent.length){
    return{
      gf:0,
      ga:0
    };
  }

  let gf=0;
  let ga=0;

  for(const x of team.recent){

    gf+=x.gf;
    ga+=x.ga;

  }

  return{
    gf:gf/team.recent.length,
    ga:ga/team.recent.length
  };
}


/* =====================================================
V6
===================================================== */

async function runV6(){

  const button=
    document.getElementById("run");

  const status=
    document.getElementById("status");

  const result=
    document.getElementById("result");

  button.disabled=true;

  result.innerHTML="";

  try{

    const from=
      parseInt(
        document.getElementById("from").value
      );

    const to=
      parseInt(
        document.getElementById("to").value
      );

    if(from>to){
      throw new Error(
        "Första säsong måste vara före sista säsong."
      );
    }


    let matches=[];


    /* ================================================
       HÄMTA ALLA SÄSONGER
       ================================================ */

    for(
      let season=from;
      season<=to;
      season++
    ){

      status.textContent=
        "⏳ Hämtar "+
        season+
        "/"+
        String(season+1).slice(2)+
        "...";


      const response=
        await fetch(
          DATA_BASE+
          seasons[season]+
          ".csv",
          {cache:"no-store"}
        );


      if(!response.ok){

        throw new Error(
          "Kunde inte läsa data/"+
          seasons[season]+
          ".csv"
        );

      }


      const csv=
        await response.text();

      const rows=
        parseCSV(csv);


      for(const row of rows){

        const hg=num(row.FTHG);
        const ag=num(row.FTAG);


        if(
          hg===null||
          ag===null||
          !row.HomeTeam||
          !row.AwayTeam
        ){
          continue;
        }


        matches.push({

          season,

          date:row.Date,

          sortDate:dateSort(row.Date),

          home:row.HomeTeam,

          away:row.AwayTeam,

          hg,

          ag,

          odds:getOdds(row)

        });

      }

    }


    matches.sort(
      (a,b)=>a.sortDate-b.sortDate
    );


    /* ================================================
       MODELL
       ================================================ */

    const stats={};

    const signals=[];

    let totalWithOdds=0;
    let modelReady=0;


    for(const m of matches){

      if(m.odds){
        totalWithOdds++;
      }


      const hs=stats[m.home];
      const as=stats[m.away];


      if(
        hs &&
        as &&
        hs.n>=5 &&
        as.n>=5 &&
        m.odds
      ){

        modelReady++;


        const hf=formStats(hs);
        const af=formStats(as);


        /*
          Långsiktig attack/försvar
        */

        const leagueGoals=1.35;


        let homeAttack=
          (hs.gf/hs.n)/leagueGoals;

        let homeDefense=
          (hs.ga/hs.n)/leagueGoals;

        let awayAttack=
          (as.gf/as.n)/leagueGoals;

        let awayDefense=
          (as.ga/as.n)/leagueGoals;


        /*
          Senaste 10 matcher vägs in.
        */

        const formWeight=.30;


        const homeFormAttack=
          hf.gf/leagueGoals;

        const homeFormDefense=
          hf.ga/leagueGoals;

        const awayFormAttack=
          af.gf/leagueGoals;

        const awayFormDefense=
          af.ga/leagueGoals;


        homeAttack=
          homeAttack*(1-formWeight)+
          homeFormAttack*formWeight;

        homeDefense=
          homeDefense*(1-formWeight)+
          homeFormDefense*formWeight;

        awayAttack=
          awayAttack*(1-formWeight)+
          awayFormAttack*formWeight;

        awayDefense=
          awayDefense*(1-formWeight)+
          awayFormDefense*formWeight;


        let hLambda=
          leagueGoals*
          homeAttack*
          awayDefense*
          1.08;


        let aLambda=
          leagueGoals*
          awayAttack*
          homeDefense;


        hLambda=
          Math.max(
            .15,
            Math.min(4.5,hLambda)
          );

        aLambda=
          Math.max(
            .15,
            Math.min(4.5,aLambda)
          );


        const model=
          modelProb(
            hLambda,
            aLambda
          );


        const market=
          m.odds.probabilities;


        const edges=[
          model[0]-market[0],
          model[1]-market[1],
          model[2]-market[2]
        ];


        let pick=0;

        if(edges[1]>edges[pick]){
          pick=1;
        }

        if(edges[2]>edges[pick]){
          pick=2;
        }


        const edge=edges[pick];

        const odds=m.odds.odds[pick];


        let resultCode="";

        if(m.hg>m.ag){
          resultCode="H";
        }else if(m.hg===m.ag){
          resultCode="D";
        }else{
          resultCode="A";
        }


        signals.push({

          season:m.season,

          date:m.date,

          home:m.home,

          away:m.away,

          pick,

          pickName:
            pick===0
            ?"Hemma"
            :pick===1
              ?"Kryss"
              :"Borta",

          modelProb:model[pick],

          marketProb:market[pick],

          edge,

          odds,

          resultCode,

          won:
            (
              pick===0&&resultCode==="H"
            )||
            (
              pick===1&&resultCode==="D"
            )||
            (
              pick===2&&resultCode==="A"
            )

        });

      }


      /*
        Uppdatera först EFTER prognosen.
      */

      addTeam(
        stats,
        m.home,
        m.hg,
        m.ag
      );

      addTeam(
        stats,
        m.away,
        m.ag,
        m.hg
      );

    }


    /* ================================================
       STATISTIK
       ================================================ */

    const buckets={

      "Alla positiva":[],
      "0–1%":[],
      "1–2%":[],
      "2–3%":[],
      "3–5%":[],
      "5–10%":[],
      ">10%":[]

    };


    for(const s of signals){

      if(s.edge>0){
        buckets["Alla positiva"].push(s);
      }

      if(s.edge>0&&s.edge<.01){
        buckets["0–1%"].push(s);
      }

      if(s.edge>=.01&&s.edge<.02){
        buckets["1–2%"].push(s);
      }

      if(s.edge>=.02&&s.edge<.03){
        buckets["2–3%"].push(s);
      }

      if(s.edge>=.03&&s.edge<.05){
        buckets["3–5%"].push(s);
      }

      if(s.edge>=.05&&s.edge<.10){
        buckets["5–10%"].push(s);
      }

      if(s.edge>=.10){
        buckets[">10%"].push(s);
      }

    }


    function statsFor(arr){

      let wins=0;
      let profit=0;
      let stake=arr.length;


      for(const s of arr){

        if(s.won){

          wins++;

          profit+=s.odds-1;

        }else{

          profit-=1;

        }

      }


      return{

        bets:arr.length,

        wins,

        hit:
          arr.length
          ?wins/arr.length*100
          :0,

        profit,

        roi:
          stake
          ?profit/stake*100
          :0

      };

    }


    /* ================================================
       OUTPUT
       ================================================ */

    let html="";


    html+=
      "<h2>🔎 Modellens räckvidd</h2>";


    html+=
      "<pre>"+
      "Matcher totalt: "+matches.length+"\n"+
      "Matcher med odds: "+totalWithOdds+"\n"+
      "Matcher där modellen var redo: "+modelReady+"\n"+
      "Analyserade signaler: "+signals.length+"\n"+
      "</pre>";


    html+=
      "<h2>📊 Edge-fördelning</h2>";


    html+=
      "<table>"+
      "<tr>"+
      "<th>Edge</th>"+
      "<th>Spel</th>"+
      "<th>Vunna</th>"+
      "<th>Träff</th>"+
      "<th>ROI</th>"+
      "<th>Resultat</th>"+
      "</tr>";


    for(const key of Object.keys(buckets)){

      const st=
        statsFor(
          buckets[key]
        );


      html+=
        "<tr>"+
        "<td>"+key+"</td>"+
        "<td>"+st.bets+"</td>"+
        "<td>"+st.wins+"</td>"+
        "<td>"+st.hit.toFixed(2)+"%</td>"+
        "<td>"+st.roi.toFixed(2)+"%</td>"+
        "<td>"+st.profit.toFixed(2)+" kr</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       ALLA POSITIVA SIGNALER
       ================================================ */

    const positive=
      buckets["Alla positiva"];


    html+=
      "<h2>🎯 Positiva signaler</h2>";


    if(!positive.length){

      html+=
        "<p>Inga positiva signaler hittades.</p>";

    }else{

      html+=
        "<table>"+
        "<tr>"+
        "<th>Datum</th>"+
        "<th>Match</th>"+
        "<th>Val</th>"+
        "<th>Modell</th>"+
        "<th>Marknad</th>"+
        "<th>Edge</th>"+
        "<th>Odds</th>"+
        "<th>Resultat</th>"+
        "</tr>";


      /*
        Sortera högsta edge först.
      */

      positive.sort(
        (a,b)=>b.edge-a.edge
      );


      for(
        let i=0;
        i<positive.length;
        i++
      ){

        const s=positive[i];


        html+=
          "<tr>"+
          "<td>"+s.date+"</td>"+
          "<td>"+s.home+" - "+s.away+"</td>"+
          "<td>"+s.pickName+"</td>"+
          "<td>"+(s.modelProb*100).toFixed(1)+"%</td>"+
          "<td>"+(s.marketProb*100).toFixed(1)+"%</td>"+
          "<td>"+(s.edge*100).toFixed(2)+"%</td>"+
          "<td>"+s.odds.toFixed(2)+"</td>"+
          "<td>"+(s.won?"✅":"❌")+"</td>"+
          "</tr>";

      }


      html+="</table>";

    }


    /* ================================================
       1X2
       ================================================ */

    html+=
      "<h2>⚽ 1X2</h2>";


    for(const type of [0,1,2]){

      const arr=
        positive.filter(
          x=>x.pick===type
        );


      const st=
        statsFor(arr);


      html+=
        "<pre>"+
        (
          type===0
          ?"HEMMA"
          :type===1
            ?"KRYSS"
            :"BORTA"
        )+
        "\n"+
        "Spel: "+st.bets+"\n"+
        "Vunna: "+st.wins+"\n"+
        "Träff: "+st.hit.toFixed(2)+"%\n"+
        "ROI: "+st.roi.toFixed(2)+"%\n"+
        "Resultat: "+st.profit.toFixed(2)+" kr\n"+
        "</pre>";

    }


    /* ================================================
       ODDSINTERVALL
       ================================================ */

    const oddsRanges=[
      [1.01,1.50],
      [1.50,2.00],
      [2.00,2.50],
      [2.50,3.00],
      [3.00,4.00],
      [4.00,99]
    ];


    html+=
      "<h2>💰 Oddsintervall</h2>";


    html+=
      "<table>"+
      "<tr>"+
      "<th>Odds</th>"+
      "<th>Spel</th>"+
      "<th>Träff</th>"+
      "<th>ROI</th>"+
      "</tr>";


    for(const range of oddsRanges){

      const arr=
        positive.filter(
          x=>
            x.odds>=range[0]&&
            x.odds<range[1]
        );


      const st=
        statsFor(arr);


      const label=
        range[1]===99
        ?range[0].toFixed(2)+"+"
        :range[0].toFixed(2)+"–"+
         range[1].toFixed(2);


      html+=
        "<tr>"+
        "<td>"+label+"</td>"+
        "<td>"+st.bets+"</td>"+
        "<td>"+st.hit.toFixed(2)+"%</td>"+
        "<td>"+st.roi.toFixed(2)+"%</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       SÄSONGER
       ================================================ */

    html+=
      "<h2>📅 Per säsong</h2>";


    html+=
      "<table>"+
      "<tr>"+
      "<th>Säsong</th>"+
      "<th>Spel</th>"+
      "<th>Träff</th>"+
      "<th>ROI</th>"+
      "<th>Resultat</th>"+
      "</tr>";


    for(
      let season=from;
      season<=to;
      season++
    ){

      const arr=
        positive.filter(
          x=>x.season===season
        );


      const st=
        statsFor(arr);


      html+=
        "<tr>"+
        "<td>"+
        season+
        "/"+
        String(season+1).slice(2)+
        "</td>"+
        "<td>"+st.bets+"</td>"+
        "<td>"+st.hit.toFixed(2)+"%</td>"+
        "<td>"+st.roi.toFixed(2)+"%</td>"+
        "<td>"+st.profit.toFixed(2)+" kr</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       TOP 20
       ================================================ */

    html+=
      "<h2>🔥 20 starkaste signalerna</h2>";


    const top20=
      [...positive]
      .sort(
        (a,b)=>b.edge-a.edge
      )
      .slice(0,20);


    html+=
      "<table>"+
      "<tr>"+
      "<th>Match</th>"+
      "<th>Val</th>"+
      "<th>Edge</th>"+
      "<th>Odds</th>"+
      "<th>Resultat</th>"+
      "</tr>";


    for(const s of top20){

      html+=
        "<tr>"+
        "<td>"+s.home+" - "+s.away+"</td>"+
        "<td>"+s.pickName+"</td>"+
        "<td>"+(s.edge*100).toFixed(2)+"%</td>"+
        "<td>"+s.odds.toFixed(2)+"</td>"+
        "<td>"+(s.won?"✅":"❌")+"</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       SLUTSATS
       ================================================ */

    const all=
      statsFor(positive);


    html+=
      "<h2>🧠 V6 Slutsats</h2>";


    html+=
      "<pre>"+
      "Positiva signaler: "+positive.length+"\n"+
      "Träffsäkerhet: "+all.hit.toFixed(2)+"%\n"+
      "ROI: "+all.roi.toFixed(2)+"%\n"+
      "Resultat: "+all.profit.toFixed(2)+" kr\n\n"+
      "V6 använder historisk lagdata före matchen.\n"+
      "Resultatet av matchen används först efter prognosen.\n"+
      "Detta är ett backtest – inte ett löfte om framtida vinst.\n"+
      "</pre>";


    result.innerHTML=html;


    status.textContent=
      "✅ V6 klart – "+
      matches.length+
      " matcher analyserade.";

  }
  catch(error){

    status.textContent=
      "❌ Fel";

    result.innerHTML=
      "<pre>"+
      error.message+
      "</pre>";

  }
  finally{

    button.disabled=false;

  }

}

</script>

</body>
</html>
