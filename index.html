<script>

"use strict";


/* =========================================================
   SÄSONGER
========================================================= */

const SEASONS=[
"1819",
"1920",
"2021",
"2122",
"2223",
"2324",
"2425",
"2526"
];


/* =========================================================
   HJÄLP
========================================================= */

function num(x){

const n=Number(
String(x??"")
.replace(",",".")
.trim()
);

return Number.isFinite(n)?n:NaN;

}


function clamp(x,a,b){

return Math.max(
a,
Math.min(b,x)
);

}


function mean(a){

if(!a.length)return 0;

return a.reduce(
(s,x)=>s+x,
0
)/a.length;

}


function fmtPct(x){

return(
x*100
).toFixed(2)+"%";

}


function outcomeName(i){

if(i===0)return"H";
if(i===1)return"D";
return"A";

}


function outcomeIndex(x){

if(x==="H")return 0;
if(x==="D")return 1;
return 2;

}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

const rows=[];

let row=[];
let cell="";
let quote=false;


for(
let i=0;
i<text.length;
i++
){

const c=text[i];


if(c==='"'){

if(
quote &&
text[i+1]==='"'
){

cell+='"';
i++;

}else{

quote=!quote;

}

}


else if(
c==="," &&
!quote
){

row.push(cell);
cell="";

}


else if(
(c==="\n"||c==="\r") &&
!quote
){

if(
c==="\r" &&
text[i+1]==="\n"
){

i++;

}

row.push(cell);
cell="";


if(
row.some(
v=>String(v).trim()!==""
)
){

rows.push(row);

}


row=[];

}


else{

cell+=c;

}

}


if(
cell!=="" ||
row.length
){

row.push(cell);

if(
row.some(
v=>String(v).trim()!==""
)
){

rows.push(row);

}

}


if(!rows.length)return[];


const headers=
rows[0].map(
x=>String(x).trim()
);


return rows.slice(1).map(r=>{

const o={};

headers.forEach(
(h,i)=>{
o[h]=r[i]??"";
}
);

return o;

});

}


/* =========================================================
   DATUM
========================================================= */

function parseDate(v){

const s=
String(v||"").trim();

if(!s)return null;


const m=
s.match(
/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/
);


if(m){

let y=Number(m[3]);

if(y<100)y+=2000;


const d=
new Date(
y,
Number(m[2])-1,
Number(m[1])
);


if(!isNaN(d.getTime())){

return d;

}

}


const d=new Date(s);

return isNaN(
d.getTime()
)
?
null
:
d;

}


/* =========================================================
   MATCH
========================================================= */

function normalize(
r,
season
){

const home=
String(
r.HomeTeam||""
).trim();


const away=
String(
r.AwayTeam||""
).trim();


const date=
parseDate(r.Date);


const hg=num(r.FTHG);
const ag=num(r.FTAG);


if(
!home||
!away||
!date||
!Number.isFinite(hg)||
!Number.isFinite(ag)
){

return null;

}


const pairs=[

[
"AvgH",
"AvgD",
"AvgA"
],

[
"B365H",
"B365D",
"B365A"
],

[
"BWH",
"BWD",
"BWA"
],

[
"WHH",
"WHD",
"WHA"
]

];


let odds=null;


for(
const p of pairs
){

const a=
p.map(
k=>num(r[k])
);


if(
a.every(
x=>
Number.isFinite(x)&&
x>1.01
)
){

odds=a;
break;

}

}


if(!odds)return null;


const ftr=
hg>ag
?
"H"
:
hg<ag
?
"A"
:
"D";


return{

season,
home,
away,
date,
hg,
ag,
ftr,
odds

};

}


/* =========================================================
   MARKET
========================================================= */

function marketProb(odds){

const inv=
odds.map(
o=>1/o
);


const s=
inv.reduce(
(a,b)=>a+b,
0
);


if(
!Number.isFinite(s)||
s<=0
){

return null;

}


return inv.map(
x=>x/s
);

}


/* =========================================================
   POISSON
========================================================= */

function poissonPMF(
k,
lambda
){

if(
!Number.isFinite(lambda)||
lambda<=0
){

return NaN;

}


if(k===0){

return Math.exp(-lambda);

}


let p=
Math.exp(-lambda);


for(
let i=1;
i<=k;
i++
){

p*=lambda/i;

}


return p;

}


function poissonProbs(
lh,
la
){

if(
!Number.isFinite(lh)||
!Number.isFinite(la)
){

return null;

}


const ph=[];
const pa=[];


for(
let k=0;
k<=12;
k++
){

ph.push(
poissonPMF(k,lh)
);

pa.push(
poissonPMF(k,la)
);

}


let H=0;
let D=0;
let A=0;


for(
let h=0;
h<=12;
h++
){

for(
let a=0;
a<=12;
a++
){

const p=
ph[h]*pa[a];


if(!Number.isFinite(p))continue;


if(h>a){

H+=p;

}
else if(h===a){

D+=p;

}
else{

A+=p;

}

}

}


const s=
H+D+A;


if(
!Number.isFinite(s)||
s<=0
){

return null;

}


return[
H/s,
D/s,
A/s
];

}


/* =========================================================
   STATE
========================================================= */

function freshState(){

return{

gf:0,
ga:0,
n:0,

form:[],

rating:0,

matches:0

};

}


function getState(
states,
team
){

if(
!states.has(team)
){

states.set(
team,
freshState()
);

}


return states.get(team);

}


function avgGF(s){

return s.n>0
?
s.gf/s.n
:
1.45;

}


function avgGA(s){

return s.n>0
?
s.ga/s.n
:
1.45;

}


/* =========================================================
   FORM
========================================================= */

function recentForm(
s,
n
){

if(
!Array.isArray(s.form)||
!s.form.length
){

return 0;

}


const a=
s.form.slice(-n);


let weight=1;
let total=0;


for(
let i=a.length-1;
i>=0;
i--
){

total+=
a[i]*weight;

weight*=0.88;

}


const denom=
(
1-
Math.pow(
0.88,
a.length
)
)/
(1-0.88);


return denom
?
total/denom
:
0;

}


/* =========================================================
   EXPECTED GOALS
========================================================= */

function expectedGoals(
sh,
sa,
formN
){

/*
  Premier League baseline.
*/

const leagueH=1.50;
const leagueA=1.20;


/*
  Attack.
*/

const homeAttack=
avgGF(sh)/
leagueH;


const awayAttack=
avgGF(sa)/
leagueA;


/*
  Defence.
*/

const homeDefence=
avgGA(sh)/
leagueA;


const awayDefence=
avgGA(sa)/
leagueH;


/*
  Grund.
*/

let lh=
leagueH*
homeAttack*
awayDefence*
1.035;


let la=
leagueA*
awayAttack*
homeDefence;


/*
  Form.

  Mycket liten effekt.
*/

const fh=
recentForm(
sh,
formN
);


const fa=
recentForm(
sa,
formN
);


lh*=
1+
clamp(
fh,
-0.35,
0.35
)*
0.035;


la*=
1+
clamp(
fa,
-0.35,
0.35
)*
0.035;


/*
  Rating.
*/

const ratingDiff=
sh.rating-sa.rating;


const rd=
clamp(
ratingDiff*0.025,
-0.05,
0.05
);


lh*=1+rd;
la*=1-rd;


/*
  Bounds.
*/

lh=
clamp(
lh,
0.25,
4.20
);


la=
clamp(
la,
0.20,
3.70
);


return[
lh,
la
];

}


/* =========================================================
   UPDATE
========================================================= */

function updateState(
states,
m
){

const h=
getState(
states,
m.home
);


const a=
getState(
states,
m.away
);


/*
  Goals.
*/

h.gf+=m.hg;
h.ga+=m.ag;
h.n++;


a.gf+=m.ag;
a.ga+=m.hg;
a.n++;


/*
  Form.
*/

if(!Array.isArray(h.form)){
h.form=[];
}

if(!Array.isArray(a.form)){
a.form=[];
}


const hs=
m.hg>m.ag
?
1
:
m.hg===m.ag
?
0.5
:
0;


const as=
m.ag>m.hg
?
1
:
m.ag===m.hg
?
0.5
:
0;


h.form.push(hs);
a.form.push(as);


if(h.form.length>20){
h.form.shift();
}

if(a.form.length>20){
a.form.shift();
}


/*
  Rating.
*/

const diff=
m.hg-m.ag;


h.rating=
clamp(
h.rating+
0.035*
(diff-0.15),
-1.5,
1.5
);


a.rating=
clamp(
a.rating-
0.035*
(diff+0.15),
-1.5,
1.5
);


h.matches=
(h.matches||0)+1;


a.matches=
(a.matches||0)+1;

}


/* =========================================================
   NY SÄSONG
========================================================= */

function seasonTransition(
states
){

for(
const s of states.values()
){

s.gf*=0.30;
s.ga*=0.30;

s.n=
Math.max(
0,
Math.round(
s.n*0.30
)
);


s.form=
Array.isArray(s.form)
?
s.form.slice(-5)
:
[];


s.rating*=0.70;

}

}


/* =========================================================
   KALIBRERING
========================================================= */

function calibrate(
p,
history,
windowSize
){

if(
!Array.isArray(p)||
p.length!==3
){

return null;

}


if(!history.length){

return p.slice();

}


const recent=
history.slice(
-Math.min(
history.length,
windowSize
)
);


const out=
p.slice();


for(
let i=0;
i<3;
i++
){

let empirical=0;
let count=0;


for(
const x of recent
){

if(
Math.abs(
x.p[i]-p[i]
)<0.08
){

empirical+=x.y[i];
count++;

}

}


if(count>=20){

out[i]=
0.65*p[i]+
0.35*
(empirical/count);

}

}


const s=
out.reduce(
(a,b)=>a+b,
0
);


if(
!Number.isFinite(s)||
s<=0
){

return p.slice();

}


return out.map(
x=>x/s
);

}


/* =========================================================
   AI PREDICTION
========================================================= */

function aiPrediction(
m,
states,
history,
formN,
minTrain,
calWindow
){

const sh=
getState(
states,
m.home
);


const sa=
getState(
states,
m.away
);


/*
  Minsta historik per lag.
*/

if(
(sh.matches||0)<minTrain||
(sa.matches||0)<minTrain
){

return null;

}


const[
lh,
la
]=expectedGoals(
sh,
sa,
formN
);


let ai=
poissonProbs(
lh,
la
);


if(!ai)return null;


ai=
calibrate(
ai,
history,
calWindow
);


if(
!ai||
!ai.every(
Number.isFinite
)
){

return null;

}


const market=
marketProb(
m.odds
);


if(!market)return null;


return{

m,
ai,
market,
lh,
la

};

}


/* =========================================================
   VALUE PICKER
========================================================= */

function valuePick(
pred,
aiWeight
){

const mw=
1-aiWeight;


/*
  Blend.
*/

const probs=[

pred.ai[0]*aiWeight+
pred.market[0]*mw,

pred.ai[1]*aiWeight+
pred.market[1]*mw,

pred.ai[2]*aiWeight+
pred.market[2]*mw

];


const s=
probs.reduce(
(a,b)=>a+b,
0
);


if(
!Number.isFinite(s)||
s<=0
){

return null;

}


const p=
probs.map(
x=>x/s
);


/*
  EV för ALLA tre utfall.
*/

const evH=
p[0]*pred.m.odds[0]-1;

const evD=
p[1]*pred.m.odds[1]-1;

const evA=
p[2]*pred.m.odds[2]-1;


const evs=[
evH,
evD,
evA
];


/*
  Välj högsta EV.

  Inte högsta sannolikhet.
*/

let pick=0;


for(
let i=1;
i<3;
i++
){

if(
evs[i]>evs[pick]
){

pick=i;

}


}


/*
  Edge för exakt samma pick.
*/

const edge=
pred.ai[pick]-
pred.market[pick];


const ev=
evs[pick];


return{

...pred,

probs:p,

evs,

pick,

edge,

ev

};

}


/* =========================================================
   BET RESULTAT
========================================================= */

function settle(
x
){

const actual=
outcomeIndex(
x.m.ftr
);


const win=
actual===x.pick;


const odds=
x.m.odds[x.pick];


const profit=
win
?
odds-1
:
-1;


return{

...x,

win,
profit

};

}


/* =========================================================
   STAT
========================================================= */

function stats(
arr
){

const bets=
arr.length;


const wins=
arr.filter(
x=>x.win
).length;


const profit=
arr.reduce(
(s,x)=>s+x.profit,
0
);


let dd=0;
let bank=0;
let peak=0;


for(
const x of arr
){

bank+=x.profit;

peak=
Math.max(
peak,
bank
);

dd=
Math.max(
dd,
peak-bank
);

}


return{

bets,
wins,

hit:
bets?
wins/bets:
0,

profit,

roi:
bets?
profit/bets:
0,

dd

};

}


/* =========================================================
   METRICS
========================================================= */

function metrics(
arr
){

if(!arr.length){

return{
acc:0,
brier:0,
ll:0
};

}


let acc=0;
let brier=0;
let ll=0;


for(
const x of arr
){

let pick=0;


for(
let i=1;
i<3;
i++
){

if(
x.probs[i]>
x.probs[pick]
){

pick=i;

}

}


if(
pick===
outcomeIndex(
x.m.ftr
)
){

acc++;

}


const y=[

x.m.ftr==="H"?1:0,
x.m.ftr==="D"?1:0,
x.m.ftr==="A"?1:0

];


for(
let i=0;
i<3;
i++
){

brier+=
Math.pow(
x.probs[i]-y[i],
2
);

}


const ai=
outcomeIndex(
x.m.ftr
);


ll-=
Math.log(
Math.max(
1e-12,
x.probs[ai]
)
);

}


return{

acc:acc/arr.length,

brier:
brier/
(arr.length*3),

ll:
ll/arr.length

};

}


/* =========================================================
   TABLE
========================================================= */

function table(
rows
){

return(

"<table>"+
"<tr>"+

rows[0].map(
x=>"<th>"+x+"</th>"
).join("")+

"</tr>"+

rows
.slice(1)
.map(
r=>
"<tr>"+
r.map(
x=>"<td>"+x+"</td>"
).join("")+
"</tr>"
)
.join("")+

"</table>"

);

}


/* =========================================================
   KÖR
========================================================= */

function run(){

const output=
document.getElementById(
"output"
);


const status=
document.getElementById(
"status"
);


output.innerHTML="";


status.textContent=
"Laddar data…";


const aiWeight=
clamp(
Number(
document.getElementById(
"aiWeight"
).value
)/100,
0,
1
);


const minEV=
Number(
document.getElementById(
"minEV"
).value
)/100;


const maxOdds=
Number(
document.getElementById(
"maxOdds"
).value
);


const minTrain=
Math.max(
1,
Number(
document.getElementById(
"minTrain"
).value
)
);


const formN=
Math.max(
3,
Number(
document.getElementById(
"formN"
).value
)
);


const calWindow=
Math.max(
50,
Number(
document.getElementById(
"calWindow"
).value
)
);


const states=
new Map();


const history=[];

const allPred=[];


let loaded=0;
let valid=0;
let analyzed=0;


Promise.all(

SEASONS.map(
async season=>{

const res=
await fetch(
"data/"+season+".csv",
{
cache:"no-store"
}
);


if(!res.ok){

throw new Error(
"Kunde inte läsa data/"+
season+
".csv ("+
res.status+
")"
);

}


const text=
await res.text();


return[
season,
parseCSV(text)
];

}

)

)


.then(
files=>{


const matches=[];


for(
const[
season,
rows
]
of files
){

loaded+=rows.length;


for(
const r of rows
){

const m=
normalize(
r,
season
);


if(m){

matches.push(m);
valid++;

}

}

}


matches.sort(
(a,b)=>
a.date-b.date
);


let currentSeason="";


/*
  Walk-forward.
*/

for(
const m of matches
){

if(
m.season!==currentSeason
){

if(currentSeason){

seasonTransition(
states
);

}


currentSeason=
m.season;

}


/*
  Predict BEFORE update.
*/

const pred=
aiPrediction(
m,
states,
history,
formN,
minTrain,
calWindow
);


if(pred){

analyzed++;

allPred.push(
pred
);


/*
  Spara historik
  före update.
*/

const actual=
outcomeIndex(
m.ftr
);


history.push({

p:pred.ai.slice(),

y:[

actual===0?1:0,
actual===1?1:0,
actual===2?1:0

]

});


if(
history.length>
calWindow
){

history.shift();

}

}


/*
  Uppdatera efter prediction.
*/

updateState(
states,
m
);

}


/* =====================================================
   HUVUDMODELL
===================================================== */

const mainPred=
allPred.map(
x=>
valuePick(
x,
aiWeight
)
).filter(Boolean);


/*

6,
1

"Bets",
"Wins",
"Hit",
"ROI",
"Profit"

x,
w

x=>

x.ev>0 &&
x.m.odds[x.pick]<=maxOdds

const s=
stats(
bets

blendRows.push([

s.wins,
fmtPct(s.hit),

s.profit.toFixed(2)+
" kr"

]);

"Wins",
"Hit",
"ROI"

const e of evLimits

mainPred

x.m.odds[x.pick]<=maxOdds

.map(
settle
);


const s=
stats(q);

">="+
(e*100)+
"%",

s.bets,
s.wins,
fmtPct(s.hit),
fmtPct(s.roi)

]);

}


/* =====================================================
   EDGE ZONER
===================================================== */

const edgeLimits=[

[0,0.05],
[0.05,0.10],
[0.10,0.15],
[0.15,0.20],
[0.20,0.25],
[0.25,1.01]

];


const edgeRows=[

[
"Edge",
"Bets",
"Wins",
"Hit",
"ROI"
]

];


for(
const[
a,b
]
of edgeLimits
){

const q=
mainPred
.filter(
x=>
x.edge>=a &&
x.edge<b &&
x.ev>=minEV &&
x.m.odds[x.pick]<=maxOdds
)
.map(
settle
);


const s=
stats(q);


edgeRows.push([

Math.round(a*100)+
"–"+
(
b>1
?
"100"
:
Math.round(b*100)
)+
"%",

s.bets,
s.wins,
fmtPct(s.hit),
fmtPct(s.roi)

]);

}


/* =====================================================
   H/D/A RESULTAT
===================================================== */

const outcomeRows=[

[
"Pick",
"Bets",
"Wins",
"Hit",
"ROI"
]

];


for(
const name of[
"H",
"D",
"A"
]
){

const q=
mainBets.filter(
x=>
x.m.ftr===name ||
x.pick===outcomeIndex(name)
);


/*
  Vi vill ha faktiska bets
  på respektive pick.
*/

const q2=
mainBets.filter(
x=>
outcomeName(
x.pick
)===name
);


const s=
stats(q2);


outcomeRows.push([

name,
s.bets,
s.wins,
fmtPct(s.hit),
fmtPct(s.roi)

]);

}

===================================================== */

const aiPick=[
0,0,0
];


const marketPick=[
0,0,0
];


const valuePickCount=[
0,0,0
];


for(
const x of mainPred
){

let ap=0;

for(
let i=1;
i<3;
i++
){

if(
x.ai[i]>
x.ai[ap]
){

ap=i;

}

}


let mp=0;

for(
let i=1;
i<3;
i++
){

if(
x.market[i]>
x.market[mp]
){

mp=i;

}

}


aiPick[ap]++;
marketPick[mp]++;
valuePickCount[x.pick]++;

}


/* =====================================================
   HOME BIAS
===================================================== */

const aiHome=
mean(
mainPred.map(
x=>x.ai[0]
)
);


const marketHome=
mean(
mainPred.map(
x=>x.market[0]
)
);


const blendHome=
mean(
mainPred.map(
x=>x.probs[0]
)
);


const aiAway=
mean(
mainPred.map(
x=>x.ai[2]
)
);


const marketAway=
mean(
mainPred.map(
x=>x.market[2]
)
);


/* =====================================================
   POISSON
===================================================== */

const avgLH=
mean(
mainPred.map(
x=>x.lh
)
);


const avgLA=
mean(
mainPred.map(
x=>x.la
)
);


const minLH=
mainPred.length
?
Math.min(
...mainPred.map(
x=>x.lh
)
)
:
0;


const maxLH=
mainPred.length
?
Math.max(
...mainPred.map(
x=>x.lh
)
)
:
0;


const minLA=
mainPred.length
?
Math.min(
...mainPred.map(
x=>x.la
)
)
:
0;


const maxLA=
mainPred.length
?
Math.max(
...mainPred.map(
x=>x.la
)
)
:
0;


/* =====================================================
   BÄSTA VÄRDESIGNALER
===================================================== */

const best=
mainPred
.filter(
x=>
x.ev>=minEV &&
x.m.odds[x.pick]<=maxOdds
)
.sort(
(a,b)=>b.ev-a.ev
)
.slice(0,10);


let signalHTML="";

if(best.length){

const rows=[

[
"Match",
"Pick",
"Odds",
"AI",
"Market",
"Blend",
"Edge",
"EV",
"Resultat"
]

];


for(
const x of best
){

const r=
settle(x);


rows.push([

x.m.home+
" – "+
x.m.away,

outcomeName(
x.pick
),

x.m.odds[x.pick]
.toFixed(2),

fmtPct(
x.ai[x.pick]
),

fmtPct(
x.market[x.pick]
),

fmtPct(
x.probs[x.pick]
),

fmtPct(
x.edge
),

fmtPct(
x.ev

?
"VINST"
:
"FÖRLUST"

}


signalHTML=

'</div>'+

valid+
'</b>'+
'</div>'+

analyzed+
'</b>'+
'</div>'+

'<b>'+

'</b>'+
'</div>'+

'<b>'+

'</div>'+

'<b>'+

'</b>'+
'</div>'+

'</div>'+

'</div>'+


'<div class="card">'+

table([

.toFixed(2)+
