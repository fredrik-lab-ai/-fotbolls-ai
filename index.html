<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fotbolls-AI Backtest V5</title>

<style>

<body>

<div class="box">

<h1>⚽ Fotbolls-AI<br>Backtest V5</h1>

<div class="intro">
V5 jämför automatiskt flera edge-nivåer och visar
vilka nivåer som faktiskt ger spel, träffsäkerhet,
ROI och resultat över historiska Premier League-säsonger.
</div>

<label>Startkapital (kr)</label>
<input id="capital" type="number" value="1" step="0.01">

<label>Daglig riskbudget (kr)</label>
<input id="daily" type="number" value="1" step="0.01">

<label>Mål (kr)</label>
<input id="target" type="number" value="10000" step="1">

<label>Första säsong</label>
<select id="from">
<option value="2018" selected>2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025">2025/26</option>
</select>

<label>Sista säsong</label>
<select id="to">
<option value="2018">2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025" selected>2025/26</option>
</select>

<button id="run" onclick="runBacktest()">
KÖR V5-ANALYS
</button>

<div id="status">Redo.</div>

<div id="result"></div>

</div>

<script>

const DATA_BASE="data/";

const seasons={
  2018:"1819",
  2019:"1920",
  2020:"2021",
  2021:"2122",
  2022:"2223",
  2023:"2324",
  2024:"2425",
  2025:"2526"
};


/* =====================================================
CSV-PARSER
===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quotes=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];
    const n=text[i+1];

    if(c==='"'){

      if(quotes && n==='"'){
        cell+='"';
        i++;
      }else{
        quotes=!quotes;
      }

    }else if(c===',' && !quotes){

      row.push(cell.trim());
      cell="";

    }else if((c==='\n'||c==='\r')&&!quotes){

      if(c==='\r'&&n==='\n')i++;

      row.push(cell.trim());
      cell="";

      if(row.some(x=>x!=="")){
        rows.push(row);
      }

      row=[];

    }else{

      cell+=c;

    }
  }

  if(cell!==""||row.length){

    row.push(cell.trim());

    if(row.some(x=>x!=="")){
      rows.push(row);
    }

  }

  if(!rows.length)return[];

  const headers=rows[0];

  return rows.slice(1).map(values=>{

    const o={};

    headers.forEach((h,i)=>{
      o[h]=values[i]||"";
    });

    return o;

  });
}


/* =====================================================
DATA
===================================================== */

async function fetchCSV(url){

  const response=
    await fetch(
      url,
      {cache:"no-store"}
    );

  if(!response.ok){

    throw new Error(
      "Kunde inte läsa "+url+
      " – HTTP "+response.status
    );

  }

  const text=
    await response.text();

  if(!text||text.length<100){

    throw new Error(
      "Tom datafil: "+url
    );

  }

  return text;
}


/* =====================================================
HJÄLPFUNKTIONER
===================================================== */

function num(v){

  if(v===undefined||v===null||v===""){
    return null;
  }

  const n=
    parseFloat(
      String(v).replace(",",".")
    );

  return Number.isFinite(n)?n:null;
}


function dateValue(v){

  if(!v)return 0;

  const p=String(v).split("/");

  if(p.length===3){

    let d=parseInt(p[0]);
    let m=parseInt(p[1]);
    let y=parseInt(p[2]);

    if(y<100)y+=2000;

    return new Date(
      y,m-1,d
    ).getTime();

  }

  const t=new Date(v).getTime();

  return Number.isFinite(t)?t:0;
}


/* =====================================================
POISSON
===================================================== */

function poisson(k,l){

  if(l<=0)return 0;

  let p=Math.exp(-l);

  for(let i=1;i<=k;i++){
    p*=l/i;
  }

  return p;
}


function modelProbabilities(homeLambda,awayLambda){

  let h=0;
  let d=0;
  let a=0;

  for(let home=0;home<=8;home++){

    for(let away=0;away<=8;away++){

      const p=
        poisson(home,homeLambda)*
        poisson(away,awayLambda);

      if(home>away){
        h+=p;
      }else if(home===away){
        d+=p;
      }else{
        a+=p;
      }

    }
  }

  const total=h+d+a;

  return[
    h/total,
    d/total,
    a/total
  ];
}


/* =====================================================
ODDS
===================================================== */

function getOdds(row){

  const home=
    num(row.B365H) ??
    num(row.BWH) ??
    num(row.WHH) ??
    num(row.AvgH);

  const draw=
    num(row.B365D) ??
    num(row.BWD) ??
    num(row.WHD) ??
    num(row.AvgD);

  const away=
    num(row.B365A) ??
    num(row.BWA) ??
    num(row.WHA) ??
    num(row.AvgA);

  if(
    home===null||
    draw===null||
    away===null
  ){
    return null;
  }

  if(
    home<=1||
    draw<=1||
    away<=1
  ){
    return null;
  }

  const ih=1/home;
  const id=1/draw;
  const ia=1/away;

  const total=ih+id+ia;

  return{

    odds:[
      home,
      draw,
      away
    ],

    probabilities:[
      ih/total,
      id/total,
      ia/total
    ]

  };
}


/* =====================================================
LAGSTATISTIK
===================================================== */

function addTeam(
  stats,
  team,
  gf,
  ga
){

  if(!stats[team]){

    stats[team]={
      gf:0,
      ga:0,
      n:0
    };

  }

  stats[team].gf+=gf;
  stats[team].ga+=ga;
  stats[team].n++;

}


/* =====================================================
KÖR EN EDGE-NIVÅ
===================================================== */

function runThreshold(
  matches,
  threshold,
  startCapital,
  dailyLimit,
  target
){

  const stats={};

  let capital=startCapital;

  let bets=0;
  let wins=0;

  let staked=0;
  let profit=0;

  let maxCapital=capital;
  let peak=capital;

  let maxDrawdown=0;

  let currentDay="";
  let dailyRisk=0;

  let targetDate=null;

  const outcomes={

    home:{bets:0,wins:0,profit:0},
    draw:{bets:0,wins:0,profit:0},
    away:{bets:0,wins:0,profit:0}

  };


  for(const match of matches){

    if(match.date!==currentDay){

      currentDay=match.date;
      dailyRisk=0;

    }


    const hs=stats[match.home];
    const as=stats[match.away];


    /*
      Minst fem historiska matcher
      innan modellen får använda laget.
    */

    if(
      hs &&
      as &&
      hs.n>=5 &&
      as.n>=5 &&
      match.odds
    ){

      const leagueGoals=1.35;


      const homeAttack=
        (hs.gf/hs.n)/leagueGoals;

      const homeDefense=
        (hs.ga/hs.n)/leagueGoals;

      const awayAttack=
        (as.gf/as.n)/leagueGoals;

      const awayDefense=
        (as.ga/as.n)/leagueGoals;


      let homeLambda=
        leagueGoals*
        homeAttack*
        awayDefense*
        1.08;

      let awayLambda=
        leagueGoals*
        awayAttack*
        homeDefense;


      homeLambda=
        Math.max(
          .15,
          Math.min(4.5,homeLambda)
        );

      awayLambda=
        Math.max(
          .15,
          Math.min(4.5,awayLambda)
        );


      const model=
        modelProbabilities(
          homeLambda,
          awayLambda
        );


      const market=
        match.odds.probabilities;


      let bestEdge=-Infinity;
      let pick=-1;


      for(let i=0;i<3;i++){

        const edge=
          model[i]-market[i];

        if(edge>bestEdge){

          bestEdge=edge;
          pick=i;

        }

      }


      /*
        Endast om edge klarar tröskeln.
      */

      if(
        pick>=0 &&
        bestEdge>=threshold &&
        dailyRisk<dailyLimit &&
        capital>0
      ){

        /*
          En spelinsats får aldrig överstiga
          dagens riskbudget.
        */

        const stake=
          Math.min(
            1,
            dailyLimit-dailyRisk,
            capital
          );


        if(stake>0){

          const odds=
            match.odds.odds[pick];


          let won=false;

          if(pick===0){
            won=
              match.homeGoals>
              match.awayGoals;
          }

          if(pick===1){
            won=
              match.homeGoals===
              match.awayGoals;
          }

          if(pick===2){
            won=
              match.homeGoals<
              match.awayGoals;
          }


          capital-=stake;

          dailyRisk+=stake;
          staked+=stake;
          bets++;


          const key=
            pick===0
            ?"home"
            :pick===1
              ?"draw"
              :"away";


          outcomes[key].bets++;


          if(won){

            wins++;

            const betProfit=
              stake*(odds-1);

            capital+=
              stake*odds;

            profit+=betProfit;

            outcomes[key].wins++;
            outcomes[key].profit+=betProfit;

          }else{

            profit-=stake;

            outcomes[key].profit-=stake;

          }


          if(capital>maxCapital){
            maxCapital=capital;
          }


          if(capital>peak){
            peak=capital;
          }


          const drawdown=
            peak>0
            ?(peak-capital)/peak
            :0;


          if(drawdown>maxDrawdown){
            maxDrawdown=drawdown;
          }


          if(
            targetDate===null &&
            capital>=target
          ){

            targetDate=
              match.date;

          }

        }

      }

    }


    /*
      Matchen läggs till efter prognosen.
      Ingen framtidsinformation används.
    */

    addTeam(
      stats,
      match.home,
      match.homeGoals,
      match.awayGoals
    );

    addTeam(
      stats,
      match.away,
      match.awayGoals,
      match.homeGoals
    );

  }


  const roi=
    staked>0
    ?profit/staked*100
    :0;


  const hitRate=
    bets>0
    ?wins/bets*100
    :0;


  return{

    threshold,

    bets,
    wins,

    hitRate,

    staked,
    profit,

    roi,

    finalCapital:capital,

    maxCapital,

    maxDrawdown,

    targetDate,

    outcomes

  };

}


/* =====================================================
HUVUDPROGRAM
===================================================== */

async function runBacktest(){

  const button=
    document.getElementById("run");

  const status=
    document.getElementById("status");

  const result=
    document.getElementById("result");


  button.disabled=true;

  result.innerHTML="";

  status.className="";

  try{

    const from=
      parseInt(
        document.getElementById("from").value
      );

    const to=
      parseInt(
        document.getElementById("to").value
      );

    const startCapital=
      num(
        document.getElementById("capital").value
      ) ?? 1;

    const dailyLimit=
      num(
        document.getElementById("daily").value
      ) ?? 1;

    const target=
      num(
        document.getElementById("target").value
      ) ?? 10000;


    if(from>to){
      throw new Error(
        "Första säsong måste vara före sista säsong."
      );
    }


    let matches=[];


    /* =================================================
       HÄMTA DATA
       ================================================= */

    for(
      let season=from;
      season<=to;
      season++
    ){

      status.textContent=
        "⏳ Hämtar "+
        season+
        "/"+
        String(season+1).slice(2)+
        "...";


      const csv=
        await fetchCSV(
          DATA_BASE+
          seasons[season]+
          ".csv"
        );


      const rows=
        parseCSV(csv);


      for(const row of rows){

        const hg=num(row.FTHG);
        const ag=num(row.FTAG);


        if(
          hg===null||
          ag===null||
          !row.HomeTeam||
          !row.AwayTeam
        ){
          continue;
        }


        matches.push({

          date:row.Date,

          time:
            dateValue(row.Date),

          home:
            row.HomeTeam,

          away:
            row.AwayTeam,

          homeGoals:hg,

          awayGoals:ag,

          odds:
            getOdds(row)

        });

      }

    }


    matches.sort(
      (a,b)=>a.time-b.time
    );


    if(!matches.length){

      throw new Error(
        "Inga matcher hittades."
      );

    }


    /* =================================================
       EDGE-TEST
       ================================================= */

    const thresholds=[
      .01,
      .02,
      .03,
      .05,
      .07
    ];


    const results=[];


    for(const threshold of thresholds){

      status.textContent=
        "🧠 Testar edge "+
        (threshold*100).toFixed(0)+
        "%...";


      /*
        Timeout ger mobilen lite luft
        mellan beräkningarna.
      */

      await new Promise(
        resolve=>setTimeout(resolve,20)
      );


      results.push(
        runThreshold(
          matches,
          threshold,
          startCapital,
          dailyLimit,
          target
        )
      );

    }


    /* =================================================
       TABELL
       ================================================= */

    let html="";


    html+=
      '<div class="section">📊 Edge-jämförelse</div>';


    html+=
      '<table>';

    html+=
      '<tr>'+
      '<th>Edge</th>'+
      '<th>Spel</th>'+
      '<th>Träff</th>'+
      '<th>ROI</th>'+
      '<th>Slut</th>'+
      '<th>Max DD</th>'+
      '</tr>';


    for(const r of results){

      html+=
        '<tr>'+
        '<td>≥ '+(r.threshold*100).toFixed(0)+'%</td>'+
        '<td>'+r.bets+'</td>'+
        '<td>'+r.hitRate.toFixed(2)+'%</td>'+
        '<td>'+r.roi.toFixed(2)+'%</td>'+
        '<td>'+r.finalCapital.toFixed(2)+' kr</td>'+
        '<td>'+r.maxDrawdown.toFixed(2)+'%</td>'+
        '</tr>';

    }


    html+='</table>';


    /* =================================================
       DETALJER FÖR 1 / 2 / 3 / 5 / 7 %
       ================================================= */

    html+=
      '<div class="section">📈 Detaljer</div>';


    for(const r of results){

      html+=
        '<pre>'+
        'EDGE ≥ '+(r.threshold*100).toFixed(0)+'%\n'+
        '────────────────────────\n'+
        'Spel: '+r.bets+'\n'+
        'Vunna: '+r.wins+'\n'+
        'Förlorade: '+(r.bets-r.wins)+'\n'+
        'Träffsäkerhet: '+r.hitRate.toFixed(2)+' %\n\n'+
        'Totalt satsat: '+r.staked.toFixed(2)+' kr\n'+
        'Resultat: '+r.profit.toFixed(2)+' kr\n'+
        'ROI: '+r.roi.toFixed(2)+' %\n'+
        'Slutkapital: '+r.finalCapital.toFixed(2)+' kr\n'+
        'Maxkapital: '+r.maxCapital.toFixed(2)+' kr\n'+
        'Max drawdown: '+r.maxDrawdown.toFixed(2)+' %\n'+
        'Mål nått: '+(r.targetDate||'NEJ')+'\n'+
        '</pre>';

    }


    /* =================================================
       UTKOMST
       ================================================= */

    html+=
      '<div class="section">⚽ Hemma / Kryss / Borta</div>';


    for(const r of results){

      html+=
        '<pre>'+
        'EDGE ≥ '+(r.threshold*100).toFixed(0)+'%\n\n'+

        'HEMMA\n'+
        'Spel: '+r.outcomes.home.bets+'\n'+
        'Vunna: '+r.outcomes.home.wins+'\n'+
        'Resultat: '+
        r.outcomes.home.profit.toFixed(2)+
        ' kr\n\n'+

        'KRYSS\n'+
        'Spel: '+r.outcomes.draw.bets+'\n'+
        'Vunna: '+r.outcomes.draw.wins+'\n'+
        'Resultat: '+
        r.outcomes.draw.profit.toFixed(2)+
        ' kr\n\n'+

        'BORTA\n'+
        'Spel: '+r.outcomes.away.bets+'\n'+
        'Vunna: '+r.outcomes.away.wins+'\n'+
        'Resultat: '+
        r.outcomes.away.profit.toFixed(2)+
        ' kr\n'+
        '────────────────────────\n'+
        '</pre>';

    }


    /* =================================================
       SAMMANFATTNING
       ================================================= */

    html+=
      '<div class="section">🔬 Sammanfattning</div>';


    const bestROI=
      results.reduce(
        (best,r)=>
          r.roi>best.roi?r:best
      );


    const mostBets=
      results.reduce(
        (best,r)=>
          r.bets>best.bets?r:best
      );


    html+=
      '<pre>'+
      'Matcher analyserade: '+matches.length+'\n\n'+

      'Flest spel:\n'+
      'Edge ≥ '+(mostBets.threshold*100).toFixed(0)+'% — '+
      mostBets.bets+' spel\n\n'+

      'Högsta historiska ROI:\n'+
      'Edge ≥ '+(bestROI.threshold*100).toFixed(0)+'% — '+
      bestROI.roi.toFixed(2)+' %\n\n'+

      'OBS:\n'+
      'Den bästa historiska ROI-nivån ska inte automatiskt\n'+
      'väljas som framtida strategi. Att testa flera nivåer\n'+
      'på samma historiska data kan ge överanpassning.\n'+
      '</pre>';


    html+=
      '<div class="note">'+
      'Modellen använder endast historik som fanns före varje match. '+
      'Detta är ett historiskt backtest och inte en prognos om framtida vinst. '+
      'Ingen automatisk betting sker.'+
      '</div>';


    result.innerHTML=html;

    status.textContent=
      "✅ V5 klart – "+
      matches.length+
      " matcher analyserade.";

    status.className="good";

  }
  catch(error){

    status.textContent=
      "❌ Fel";

    status.className="bad";

    result.innerHTML=
      "<pre>"+
      (
        error.message||
        String(error)
      )+
      "</pre>";

  }
  finally{

    button.disabled=false;

  }

}

</script>

</body>
</html>
