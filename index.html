/* =========================================================
   HJÄLPFUNKTIONER
========================================================= */

function num(x){

  const n=Number(
    String(x??"")
      .replace(",",".")
      .trim()
  );

  return Number.isFinite(n)?n:NaN;

}


function clamp(x,a,b){

  return Math.max(
    a,
    Math.min(b,x)
  );

}


function mean(a){

  if(!a.length)return 0;

  return a.reduce(
    (s,x)=>s+x,
    0
  )/a.length;

}


function fmtPct(x){

  return (
    x*100
  ).toFixed(2)+"%";

}


function outcomeName(i){

  if(i===0)return "H";
  if(i===1)return "D";
  return "A";

}


function actualIndex(ftr){

  if(ftr==="H")return 0;
  if(ftr==="D")return 1;
  return 2;

}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

  const rows=[];

  let row=[];
  let cell="";
  let quote=false;


  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c=text[i];


    if(c==='"'){

      if(
        quote &&
        text[i+1]==='"'
      ){

        cell+='"';
        i++;

      }else{

        quote=!quote;

      }

    }

    else if(
      c==="," &&
      !quote
    ){

      row.push(cell);
      cell="";

    }

    else if(
      (
        c==="\n" ||
        c==="\r"
      ) &&
      !quote
    ){

      if(
        c==="\r" &&
        text[i+1]==="\n"
      ){

        i++;

      }

      row.push(cell);
      cell="";


      if(
        row.some(
          v=>String(v).trim()!==""
        )
      ){

        rows.push(row);

      }


      row=[];

    }

    else{

      cell+=c;

    }

  }


  if(
    cell!=="" ||
    row.length
  ){

    row.push(cell);


    if(
      row.some(
        v=>String(v).trim()!==""
      )
    ){

      rows.push(row);

    }

  }


  if(!rows.length){

    return [];

  }


  const headers=
    rows[0].map(
      x=>String(x).trim()
    );


  return rows
    .slice(1)
    .map(r=>{

      const o={};


      headers.forEach(
        (h,i)=>{
          o[h]=r[i]??"";
        }
      );


      return o;

    });

}


/* =========================================================
   DATUM
========================================================= */

function parseDate(v){

  const s=
    String(v||"").trim();


  if(!s)return null;


  const m=s.match(
    /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/
  );


  if(m){

    let y=
      Number(m[3]);


    if(y<100){
      y+=2000;
    }


    const d=
      new Date(
        y,
        Number(m[2])-1,
        Number(m[1])
      );


    if(
      !isNaN(
        d.getTime()
      )
    ){

      return d;

    }

  }


  const d=
    new Date(s);


  return isNaN(
    d.getTime()
  )?
    null:
    d;

}


/* =========================================================
   NORMALISERA MATCH
========================================================= */

function normalize(
  r,
  season
){

  const home=
    String(
      r.HomeTeam||""
    ).trim();


  const away=
    String(
      r.AwayTeam||""
    ).trim();


  const date=
    parseDate(
      r.Date
    );


  const hg=
    num(r.FTHG);


  const ag=
    num(r.FTAG);


  if(
    !home ||
    !away ||
    !date ||
    !Number.isFinite(hg) ||
    !Number.isFinite(ag)
  ){

    return null;

  }


  const pairs=[

    [
      "AvgH",
      "AvgD",
      "AvgA"
    ],

    [
      "B365H",
      "B365D",
      "B365A"
    ],

    [
      "BWH",
      "BWD",
      "BWA"
    ],

    [
      "WHH",
      "WHD",
      "WHA"
    ]

  ];


  let odds=null;


  for(
    const p of pairs
  ){

    const a=
      p.map(
        k=>num(r[k])
      );


    if(
      a.every(
        x=>
          Number.isFinite(x) &&
          x>1.01
      )
    ){

      odds=a;

      break;

    }

  }


  if(!odds){

    return null;

  }


  const ftr=
    hg>ag
      ?"H"
      :
    hg<ag
      ?"A"
      :
      "D";


  return{

    season,
    home,
    away,
    date,
    hg,
    ag,
    ftr,
    odds

  };

}


/* =========================================================
   MARKNAD
========================================================= */

function marketProb(odds){

  const inv=
    odds.map(
      o=>1/o
    );


  const s=
    inv.reduce(
      (a,b)=>a+b,
      0
    );


  if(
    !Number.isFinite(s) ||
    s<=0
  ){

    return null;

  }


  const p=
    inv.map(
      x=>x/s
    );


  if(
    !p.every(
      Number.isFinite
    )
  ){

    return null;

  }


  return p;

}


/* =========================================================
   POISSON
========================================================= */

function poissonPMF(
  k,
  lambda
){

  if(
    !Number.isFinite(lambda) ||
    lambda<=0
  ){

    return NaN;

  }


  if(k===0){

    return Math.exp(-lambda);

  }


  let p=
    Math.exp(-lambda);


  for(
    let i=1;
    i<=k;
    i++
  ){

    p*=lambda/i;

  }


  return p;

}


function poissonProbs(
  lh,
  la
){

  if(
    !Number.isFinite(lh) ||
    !Number.isFinite(la)
  ){

    return null;

  }


  const ph=[];
  const pa=[];


  for(
    let k=0;
    k<=12;
    k++
  ){

    ph.push(
      poissonPMF(k,lh)
    );

    pa.push(
      poissonPMF(k,la)
    );

  }


  let H=0;
  let D=0;
  let A=0;


  for(
    let h=0;
    h<=12;
    h++
  ){

    for(
      let a=0;
      a<=12;
      a++
    ){

      const p=
        ph[h]*
        pa[a];


      if(
        !Number.isFinite(p)
      ){

        continue;

      }


      if(h>a){

        H+=p;

      }

      else if(h===a){

        D+=p;

      }

      else{

        A+=p;

      }

    }

  }


  const s=
    H+D+A;


  if(
    !Number.isFinite(s) ||
    s<=0
  ){

    return null;

  }


  const result=[

    H/s,
    D/s,
    A/s

  ];


  if(
    !result.every(
      Number.isFinite
    )
  ){

    return null;

  }


  return result;

}


/* =========================================================
   STATE
========================================================= */

function freshState(){

  return{

    gf:0,
    ga:0,
    n:0,

    form:[],

    rating:0,

    matches:0

  };

}


function getState(
  states,
  team
){

  if(
    !states.has(team)
  ){

    states.set(
      team,
      freshState()
    );

  }


  return states.get(team);

}


function avgGF(s){

  return s.n>0
    ?
      s.gf/s.n
    :
      1.45;

}


function avgGA(s){

  return s.n>0
    ?
      s.ga/s.n
    :
      1.45;

}


/* =========================================================
   FORM
========================================================= */

function recentForm(
  s,
  n
){

  if(
    !Array.isArray(s.form) ||
    !s.form.length
  ){

    return 0;

  }


  const a=
    s.form.slice(-n);


  let weight=1;
  let total=0;


  for(
    let i=a.length-1;
    i>=0;
    i--
  ){

    total+=
      a[i]*weight;

    weight*=0.88;

  }


  const denom=
    (
      1-
      Math.pow(
        0.88,
        a.length
      )
    )/
    (1-0.88);


  return denom
    ?
      total/denom
    :
      0;

}


/* =========================================================
   EXPECTED GOALS
========================================================= */

function expectedGoals(
  sh,
  sa,
  leagueH,
  leagueA,
  formN
){

  /*
    Hemmalagets attack.
  */

  const homeAttack=
    avgGF(sh)/
    leagueH;


  /*
    Hemmalagets försvar.
  */

  const homeDefence=
    avgGA(sh)/
    leagueA;


  /*
    Bortalagets attack.
  */

  const awayAttack=
    avgGF(sa)/
    leagueA;


  /*
    Bortalagets försvar.
  */

  const awayDefence=
    avgGA(sa)/
    leagueH;


  /*
    Separat attack/försvar.
  */

  let lh=
    leagueH*
    homeAttack*
    awayDefence*
    1.035;


  let la=
    leagueA*
    awayAttack*
    homeDefence;


  /*
    Form.

    Form används mycket försiktigt.
  */

  const fh=
    recentForm(
      sh,
      formN
    );


  const fa=
    recentForm(
      sa,
      formN
    );


  lh*=
    1+
    clamp(
      fh,
      -0.35,
      0.35
    )*
    0.035;


  la*=
    1+
    clamp(
      fa,
      -0.35,
      0.35
    )*
    0.035;


  /*
    Rating.
  */

  const rd=
    clamp(
      (
        sh.rating-
        sa.rating
      )*
      0.025,

      -0.05,
      0.05
    );


  lh*=1+rd;
  la*=1-rd;


  /*
    Säkerhetsgränser.
  */

  lh=
    clamp(
      lh,
      0.25,
      4.20
    );


  la=
    clamp(
      la,
      0.20,
      3.70
    );


  return[
    lh,
    la
  ];

}


/* =========================================================
   UPPDATERA STATE
========================================================= */

function updateState(
  states,
  m
){

  const h=
    getState(
      states,
      m.home
    );


  const a=
    getState(
      states,
      m.away
    );


  /*
    Mål.
  */

  h.gf+=m.hg;
  h.ga+=m.ag;
  h.n++;


  a.gf+=m.ag;
  a.ga+=m.hg;
  a.n++;


  /*
    Form.
  */

  if(
    !Array.isArray(h.form)
  ){

    h.form=[];

  }


  if(
    !Array.isArray(a.form)
  ){

    a.form=[];

  }


  const hs=
    m.hg>m.ag
      ?1
      :
    m.hg===m.ag
      ?0.5
      :
      0;


  const as=
    m.ag>m.hg
      ?1
      :
    m.ag===m.hg
      ?0.5
      :
      0;


  h.form.push(hs);
  a.form.push(as);


  if(
    h.form.length>20
  ){

    h.form.shift();

  }


  if(
    a.form.length>20
  ){

    a.form.shift();

  }


  /*
    Rating.
  */

  const diff=
    m.hg-m.ag;


  h.rating=
    clamp(
      h.rating+
      0.035*
      (diff-0.15),

      -1.5,
      1.5
    );


  a.rating=
    clamp(
      a.rating-
      0.035*
      (diff+0.15),

      -1.5,
      1.5
    );


  /*
    Tidigare matcher.
  */

  h.matches=
    (h.matches||0)+1;


  a.matches=
    (a.matches||0)+1;

}


/* =========================================================
   SÄSONGSÖVERGÅNG
========================================================= */

function seasonTransition(
  states
){

  for(
    const s of states.values()
  ){

    /*
      Ny säsong:

      gamla målstatistiken vägs ner,
      rating behålls delvis.
    */

    s.gf*=0.30;
    s.ga*=0.30;


    s.n=
      Math.max(
        0,
        Math.round(
          s.n*0.30
        )
      );


    s.form=
      Array.isArray(s.form)
        ?
          s.form.slice(-5)
        :
          [];


    s.rating*=0.70;

  }

}


/* =========================================================
   KALIBRERING
========================================================= */

function calibrate(
  p,
  history,
  windowSize
){

  if(
    !Array.isArray(p) ||
    p.length!==3
  ){

    return null;

  }


  if(
    !history.length
  ){

    return p.slice();

  }


  const k=
    Math.min(
      history.length,
      windowSize
    );


  const recent=
    history.slice(-k);


  const out=
    p.slice();


  for(
    let i=0;
    i<3;
    i++
  ){

    let nume=0;
    let den=0;


    for(
      const x of recent
    ){

      if(
        !x ||
        !Array.isArray(x.p) ||
        !Array.isArray(x.y)
      ){

        continue;

      }


      if(
        Math.abs(
          x.p[i]-p[i]
        )<0.08
      ){

        nume+=x.y[i];
        den++;

      }

    }


    if(
      den>=20
    ){

      const empirical=
        nume/den;


      out[i]=
        0.65*p[i]+
        0.35*empirical;

    }

  }


  const s=
    out.reduce(
      (a,b)=>a+b,
      0
    );


  if(
    !Number.isFinite(s) ||
    s<=0
  ){

    return p.slice();

  }


  const result=
    out.map(
      x=>x/s
    );


  if(
    !result.every(
      Number.isFinite
    )
  ){

    return p.slice();

  }


  return result;

}


/* =========================================================
   ANALYSERA MATCH
========================================================= */

function analyzeMatch(
  m,
  states,
  history,
  formN,
  minTrain,
  calWindow
){

  const sh=
    getState(
      states,
      m.home
    );


  const sa=
    getState(
      states,
      m.away
    );


  /*
    Nu krävs 150 matcher per lag.

    Standard är 40.

    Detta ger betydligt fler
    walk-forward-prediktioner.
  */

  const ready=
    (sh.matches||0)>=minTrain &&
    (sa.matches||0)>=minTrain;


  if(!ready){

    return null;

  }


  /*
    Premier League baseline.
  */

  const leagueH=1.50;
  const leagueA=1.20;


  const[
    lh,
    la
  ]=
    expectedGoals(
      sh,
      sa,
      leagueH,
      leagueA,
      formN
    );


  if(
    !Number.isFinite(lh) ||
    !Number.isFinite(la)
  ){

    return null;

  }


  /*
    AI.
  */

  let ai=
    poissonProbs(
      lh,
      la
    );


  if(!ai){

    return null;

  }


  /*
    Kalibrering.
  */

  ai=
    calibrate(
      ai,
      history,
      calWindow
    );


  if(
    !ai ||
    !ai.every(
      Number.isFinite
    )
  ){

    return null;

  }


  /*
    Marknad.
  */

  const market=
    marketProb(
      m.odds
    );


  if(!market){

    return null;

  }


  return{

    m,
    ai,
    market,
    lh,
    la

  };

}


/* =========================================================
   BLEND
========================================================= */

function makeBlend(
  pred,
  aiWeight
){

  const marketWeight=
    1-aiWeight;


  const probs=[

    pred.ai[0]*
      aiWeight+
    pred.market[0]*
      marketWeight,

    pred.ai[1]*
      aiWeight+
    pred.market[1]*
      marketWeight,

    pred.ai[2]*
      aiWeight+
    pred.market[2]*
      marketWeight

  ];


  const s=
    probs.reduce(
      (a,b)=>a+b,
      0
    );


  if(
    !Number.isFinite(s) ||
    s<=0
  ){

    return null;

  }


  const p=
    probs.map(
      x=>x/s
    );


  let pick=0;


  for(
    let i=1;
    i<3;
    i++
  ){

    if(
      p[i]>p[pick]
    ){

      pick=i;

    }

  }


  const edge=
    pred.ai[pick]-
    pred.market[pick];


  const ev=
    p[pick]*
    pred.m.odds[pick]-
    1;


  return{

    ...pred,

    probs:p,

    pick,

    edge,

    ev

  };

}


/* =========================================================
   BET RESULT
========================================================= */

function betResult(
  x
){

  const ai=
    actualIndex(
      x.m.ftr
    );


  const win=
    ai===x.pick;


  const odds=
    x.m.odds[x.pick];


  const profit=
    win
      ?
        odds-1
      :
        -1;


  return{

    ...x,

    win,
    profit

  };

}


/* =========================================================
   STATISTIK
========================================================= */

function statRow(
  arr
){

  const bets=
    arr.length;


  const wins=
    arr.filter(
      x=>x.win
    ).length;


  const profit=
    arr.reduce(
      (s,x)=>
        s+x.profit,
      0
    );


  return{

    bets,
    wins,

    hit:
      bets
        ?
          wins/bets
        :
          0,

    profit,

    roi:
      bets
        ?
          profit/bets
        :
          0

  };

}


/* =========================================================
   DRAWDOWN
========================================================= */

function maxDrawdown(
  arr
){

  let bank=0;
  let peak=0;
  let dd=0;


  for(
    const x of arr
  ){

    bank+=x.profit;


    if(
      bank>peak
    ){

      peak=bank;

    }


    dd=
      Math.max(
        dd,
        peak-bank
      );

  }


  return dd;

}


/* =========================================================
   METRICS
========================================================= */

function metrics(
  arr
){

  if(!arr.length){

    return{

      acc:0,
      brier:0,
      ll:0

    };

  }


  let acc=0;
  let brier=0;
  let ll=0;


  for(
    const x of arr
  ){

    const pred=
      x.probs;


    const actual=
      x.m.ftr;


    let pick=0;


    for(
      let i=1;
      i<3;
      i++
    ){

      if(
        pred[i]>pred[pick]
      ){

        pick=i;

      }

    }


    if(
      outcomeName(pick)===
      actual
    ){

      acc++;

    }


    const y=[

      actual==="H"?1:0,
      actual==="D"?1:0,
      actual==="A"?1:0

    ];


    for(
      let i=0;
      i<3;
      i++
    ){

      brier+=
        Math.pow(
          pred[i]-y[i],
          2
        );

    }


    const ai=
      actualIndex(
        actual
      );


    ll-=
      Math.log(
        Math.max(
          1e-12,
          pred[ai]
        )
      );

  }


  return{

    acc:
      acc/arr.length,

    brier:
      brier/
      (arr.length*3),

    ll:
      ll/arr.length

  };

}


/* =========================================================
   TABLE
========================================================= */

function table(
  rows
){

  return(

    "<table>"+
    "<tr>"+

    rows[0]
      .map(
        x=>
          "<th>"+
          x+
          "</th>"
      )
      .join("")+

    "</tr>"+

    rows
      .slice(1)
      .map(
        r=>
          "<tr>"+
          r.map(
            x=>
              "<td>"+
              x+
              "</td>"
          ).join("")+
          "</tr>"
      )
      .join("")+

    "</table>"

  );

}


/* =========================================================
   RESULTAT PER UTFALL
========================================================= */

function outcomeStats(
  arr
){

  const result={

    H:[],
    D:[],
    A:[]

  };


  for(
    const x of arr
  ){

    result[
      outcomeName(
        x.pick
      )
    ].push(x);

  }


  return result;

}


/* =========================================================
   KÖR ANALYS
========================================================= */

function run(){

  const output=
    document.getElementById(
      "output"
    );


  const status=
    document.getElementById(
      "status"
    );


  output.innerHTML="";

  status.textContent=
    "Laddar data…";


  /*
    Inställningar.
  */

  const mainAI=
    clamp(
      Number(
        document.getElementById(
          "aiWeight"
        ).value
      )/100,

      0,
      1
    );


  const minEV=
    Number(
      document.getElementById(
        "minEV"
      ).value
    )/100;


  const maxOdds=
    Number(
      document.getElementById(
        "maxOdds"
      ).value
    );


  const minTrain=
    Math.max(
      1,
      Number(
        document.getElementById(
          "minTrain"
        ).value
      )
    );


  const formN=
    Math.max(
      3,
      Number(
        document.getElementById(
          "formN"
        ).value
      )
    );


  const calWindow=
    Math.max(
      50,
      Number(
        document.getElementById(
          "calWindow"
        ).value
      )
    );


  /*
    State.
  */

  const states=
    new Map();


  const history=[];

  const allPred=[];


  let loaded=0;
  let validMatches=0;
  let analyzed=0;


  /*
    Läs CSV.
  */

  Promise.all(

    SEASONS.map(
      async season=>{

        const res=
          await fetch(
            "data/"+season+".csv",
            {
              cache:"no-store"
            }
          );


        if(!res.ok){

          throw new Error(
            "Kunde inte läsa data/"+
            season+
            ".csv ("+
            res.status+
            ")"
          );

        }


        const text=
          await res.text();


        return[

          season,

          parseCSV(
            text
          )

        ];

      }
    )

  )


  .then(
    files=>{

      /*
        Lägg alla matcher
        i en gemensam kronologisk
        lista.
      */

      const allMatches=[];


      for(
        const[
          season,
          rows
        ]
        of files
      ){

        loaded+=rows.length;


        for(
          const r of rows
        ){

          const m=
            normalize(
              r,
              season
            );


          if(m){

            allMatches.push(m);
            validMatches++;

          }

        }

      }


      allMatches.sort(
        (a,b)=>
          a.date-b.date
      );


      let currentSeason="";


      /*
        Walk-forward.
      */

      for(
        const m of allMatches
      ){

        /*
          Ny säsong.
        */

        if(
          m.season!==
          currentSeason
        ){

          if(currentSeason){

            seasonTransition(
              states
            );

          }


          currentSeason=
            m.season;

        }


        /*
          Predict BEFORE update.
        */

        const pred=
          analyzeMatch(
            m,
            states,
            history,
            formN,
            minTrain,
            calWindow
          );


        if(pred){

          analyzed++;


          /*
            Spara AI + Market.
          */

          allPred.push(
            pred
          );


          /*
            Historik för kalibrering.

            Viktigt:
            prediction sparas före
            resultatet påverkar state.
          */

          const aiIndex=
            actualIndex(
              m.ftr
            );


          const y=[

            aiIndex===0?1:0,
            aiIndex===1?1:0,
            aiIndex===2?1:0

          ];


          history.push({

            p:
              pred.ai.slice(),

            y

          });


          if(
            history.length>
            calWindow
          ){

            history.shift();

          }

        }


        /*
          Uppdatera först EFTER prediction.
        */

        updateState(
          states,
          m
        );

      }


      /*
        =====================================================
        HUVUDSTRATEGI
        =====================================================
      */

      const mainPred=
        allPred
          .map(
            x=>
              makeBlend(
                x,
                mainAI
              )
          )
          .filter(Boolean);


      const mainBets=
        mainPred
          .filter(
            x=>

              x.ev>=minEV &&

              x.edge>=0.10 &&

              x.edge<0.15 &&

              x.m.odds[x.pick]<=maxOdds

          )
          .map(
            betResult
          );


      /*
        =====================================================
        TRAIN / VALIDATION / OOS
        =====================================================
      */

      const splitDate1=
        new Date(
          2022,
          6,
          1
        );


      const splitDate2=
        new Date(
          2024,
          6,
          1
        );


      const train=
        mainBets.filter(
          x=>
            x.m.date<
            splitDate1
        );


      const validation=
        mainBets.filter(
          x=>
            x.m.date>=splitDate1 &&
            x.m.date<splitDate2
        );


      const oos=
        mainBets.filter(
          x=>
            x.m.date>=splitDate2
        );


      /*
        =====================================================
        METRICS FÖR 25/75
        =====================================================
      */

      const mainMetrics=
        metrics(
          mainPred
        );


      /*
        =====================================================
        EDGE ZONER
        =====================================================
      */

      const edgeBins=[

        [0,0.05],
        [0.05,0.10],
        [0.10,0.15],
        [0.15,0.20],
        [0.20,0.25],
        [0.25,1.01]

      ];


      const edgeRows=[

        [
          "Edge",
          "Bets",
          "Wins",
          "Hit",
          "ROI"
        ]

      ];


      for(
        const[
          a,
          b
        ]
        of edgeBins
      ){

        const q=
          mainPred
            .filter(
              x=>
                x.edge>=a &&
                x.edge<b &&
                x.ev>=minEV &&
                x.m.odds[x.pick]<=maxOdds
            )
            .map(
              betResult
            );


        const s=
          statRow(q);


        edgeRows.push([

          Math.round(a*100)+
          "–"+
          (
            b>1
              ?
                "100"
              :
                Math.round(b*100)
          )+
          "%",

          s.bets,
          s.wins,
          fmtPct(s.hit),
          fmtPct(s.roi)

        ]);

      }


      /*
        =====================================================
        EV ZONER
        =====================================================
      */

      const evBins=[

        0.03,
        0.05,
        0.07,
        0.10,
        0.15

      ];


      const evRows=[

        [
          "EV-gräns",
          "Bets",
          "Wins",
          "Hit",
          "ROI"
        ]

      ];


      for(
        const e of evBins
      ){

        const q=
          mainPred
            .filter(
              x=>
                x.ev>=e &&
                x.m.odds[x.pick]<=maxOdds
            )
            .map(
              betResult
            );


        const s=
          statRow(q);


        evRows.push([

          ">="+
          (e*100)+
          "%",

          s.bets,
          s.wins,
          fmtPct(s.hit),
          fmtPct(s.roi)

        ]);

      }


      /*
        =====================================================
        RIKTIGT BLEND-TEST
        =====================================================

        Varje vikt räknas om helt:

        AI
        Market
        Blend
        Pick
        EV
        Resultat
      */

      const blendRows=[

        [
          "AI / Market",
          "Bets",
          "Wins",
          "Hit",
          "ROI"
        ]

      ];


      const blendWeights=[
        0,
        0.25,
        0.50,
        0.75,
        1
      ];


      const blendData={};


      for(
        const w of blendWeights
      ){

        const preds=
          allPred
            .map(
              x=>
                makeBlend(
                  x,
                  w
                )
            )
            .filter(Boolean);


        const bets=
          preds
            .filter(
              x=>
                x.ev>=minEV &&
                x.m.odds[x.pick]<=maxOdds
            )
            .map(
              betResult
            );


        const s=
          statRow(
            bets
          );


        blendData[w]={
          preds,
          bets,
          stats:s
        };


        blendRows.push([

          Math.round(w*100)+
          " / "+
          Math.round((1-w)*100),

          s.bets,
          s.wins,
          fmtPct(s.hit),
          fmtPct(s.roi)

        ]);

      }


      /*
        =====================================================
        PICK-FÖRDELNING
        =====================================================
      */

      const selected=
        blendData[mainAI]
          ?
            blendData[mainAI].preds
          :
            mainPred;


      const aiCounts=[
        0,
        0,
        0
      ];


      const marketCounts=[
        0,
        0,
        0
      ];


      const blendCounts=[
        0,
        0,
        0
      ];


      for(
        const x of selected
      ){

        let aiPick=0;


        for(
          let i=1;
          i<3;
          i++
        ){

          if(
            x.ai[i]>
            x.ai[aiPick]
          ){

            aiPick=i;

          }

        }


        let marketPick=0;


        for(
          let i=1;
          i<3;
          i++
        ){

          if(
            x.market[i]>
            x.market[marketPick]
          ){

            marketPick=i;

          }

        }


        aiCounts[aiPick]++;
        marketCounts[marketPick]++;
        blendCounts[x.pick]++;

      }


      /*
        =====================================================
        PICK-RESULTAT
        =====================================================
      */

      const outcome=
        outcomeStats(
          mainBets
        );


      const outcomeRows=[

        [
          "Pick",
          "Bets",
          "Wins",
          "Hit",
          "ROI"
        ]

      ];


      for(
        const name of ["H","D","A"]
      ){

        const s=
          statRow(
            outcome[name]
          );


        outcomeRows.push([

          name,
          s.bets,
          s.wins,
          fmtPct(s.hit),
          fmtPct(s.roi)

        ]);

      }


      /*
        =====================================================
        HOME BIAS
        =====================================================
      */

      const aiHome=
        mean(
          selected.map(
            x=>x.ai[0]
          )
        );


      const marketHome=
        mean(
          selected.map(
            x=>x.market[0]
          )
        );


      const blendHome=
        mean(
          selected.map(
            x=>x.probs[0]
          )
        );


      const homeBias=
        aiHome-
        marketHome;


      const homePickRate=
        selected.length
          ?
            blendCounts[0]/
            selected.length
          :
            0;


      /*
        =====================================================
        POISSON
        =====================================================
      */

      const avgLH=
        mean(
          selected.map(
            x=>x.lh
          )
        );


      const avgLA=
        mean(
          selected.map(
            x=>x.la
          )
        );


      const minLH=
        selected.length
          ?
            Math.min(
              ...selected.map(
                x=>x.lh
              )
            )
          :
            0;


      const maxLH=
        selected.length
          ?
            Math.max(
              ...selected.map(
                x=>x.lh
              )
            )
          :
            0;


      const minLA=
        selected.length
          ?
            Math.min(
              ...selected.map(
                x=>x.la
              )
            )
          :
            0;


      const maxLA=
        selected.length
          ?
            Math.max(
              ...selected.map(
                x=>x.la
              )
            )
          :
            0;


      /*
        =====================================================
        DATA CONTROL
        =====================================================
      */

      const skipped=
        validMatches-
        analyzed;


      /*
        =====================================================
        OUTPUT
        =====================================================
      */

      const main=
        statRow(
          mainBets
        );


      output.innerHTML=


        '<div class="card">'+

        '<h3>📊 Resultat</h3>'+

        '<div class="grid">'+

        '<div class="metric">'+
        'CSV-rader<br>'+
        '<b>'+
        loaded+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Giltiga matcher<br>'+
        '<b>'+
        validMatches+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Analyserade<br>'+
        '<b>'+
        analyzed+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Ej redo ännu<br>'+
        '<b>'+
        skipped+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Accuracy<br>'+
        '<b>'+
        fmtPct(
          mainMetrics.acc
        )+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Brier<br>'+
        '<b>'+
        mainMetrics.brier.toFixed(4)+
        '</b>'+
        '</div>'+


        '<div class="metric">'+
        'Log Loss<br>'+
        '<b>'+
        mainMetrics.ll.toFixed(4)+
        '</b>'+
        '</div>'+


        '</div>'+

        '</div>'+


        '<div class="card">'+

        '<h3>🎯 Huvudstrategi</h3>'+

        '<p>'+
        '<b>AI '+
        Math.round(mainAI*100)+
        '% / Market '+
        Math.round((1-mainAI)*100)+
        '%</b>'+
        '<br>'+
        'Edge 10–15% · EV ≥ '+
        (minEV*100)+
        '% · Max odds '+
        maxOdds+
        '</p>'+


        table([

          [
            "Bets",
            "Wins",
            "Hit",
            "Profit",
            "ROI",
            "Max DD"
          ],

          [

            main.bets,

            main.wins,

            fmtPct(
              main.hit
            ),

            main.profit.toFixed(2)+
            " kr",

            fmtPct(
              main.roi
            ),

            maxDrawdown(
              mainBets
            ).toFixed(2)+
            " kr"

          ]

        ])+

        '</div>'+


        '<div class="card">'+

        '<h3>🧪 Train / Validation / OOS</h3>'+

        table([

          [
            "Period",
            "Bets",
            "Wins",
            "Hit",
            "ROI",
            "Profit"
          ],


          [

            "Train",

            train.length,

            train.filter(
              x=>x.win
            ).length,

            fmtPct(
              statRow(
                train
              ).hit
            ),

            fmtPct(
              statRow(
                train
              ).roi
            ),

            statRow(
              train
            ).profit.toFixed(2)+
            " kr"

          ],


          [

            "Validation",

            validation.length,

            validation.filter(
              x=>x.win
            ).length,

            fmtPct(
              statRow(
                validation
              ).hit
            ),

            fmtPct(
              statRow(
                validation
              ).roi
            ),

            statRow(
              validation
            ).profit.toFixed(2)+
            " kr"

          ],


          [

            "OOS",

            oos.length,

            oos.filter(
              x=>x.win
            ).length,

            fmtPct(
              statRow(
                oos
              ).hit
            ),

            fmtPct(
              statRow(
                oos
              ).roi
            ),

            statRow(
              oos
            ).profit.toFixed(2)+
            " kr"

          ]

        ])+

        '<div class="note">'+
        'OOS = säsongerna 2024/25 och 2025/26. '+
        'Det är denna kolumn vi framför allt ska bevaka innan vi börjar optimera modellen.'+
        '</div>'+

        '</div>'+


        '<div class="card">'+

        '<h3>⚖️ Riktigt blend-test</h3>'+

        table(
          blendRows
        )+

        '<div class="note">'+
        'Nu räknas varje AI/Market-vikt om från grunden med eget pick och eget EV. '+
        'De fem raderna ska därför kunna ge olika resultat.'+
        '</div>'+

        '</div>'+


        '<div class="card">'+

        '<h3>🏁 H / D / A – resultat</h3>'+

        table(
          outcomeRows
        )+

        '</div>'+


        '<div class="card">'+

        '<h3>🎯 H / D / A – valfrekvens</h3>'+

        table([

          [
            "Utfall",
            "AI pick",
            "Market pick",
            "Blend pick"
          ],

          [
            "H",
            aiCounts[0],
            marketCounts[0],
            blendCounts[0]
          ],

          [
            "D",
            aiCounts[1],
            marketCounts[1],
            blendCounts[1]
          ],

          [
            "A",
            aiCounts[2],
            marketCounts[2],
            blendCounts[2]
          ]

        ])+

        '</div>'+


        '<div class="card">'+

        '<h3>🏠 Home-bias diagnostik</h3>'+

        table([

          [
            "Mätning",
            "Resultat"
          ],

          [
            "AI home probability",
            fmtPct(aiHome)
          ],

          [
            "Market home probability",
            fmtPct(marketHome)
          ],

          [
            "Blend home probability",
            fmtPct(blendHome)
          ],

          [
            "AI − Market home edge",
            fmtPct(homeBias)
          ],

          [
            "Blend home-pick rate",
            fmtPct(homePickRate)
          ]

        ])+

        '<div class="note">'+
        'Det här är en ren diagnostik. Vi ska inte ändra modellen bara för att denna siffra är positiv eller negativ.'+
        '</div>'+

        '</div>'+


        '<div class="card">'+

        '<h3>⚽ Poisson / målmodell</h3>'+

        table([

          [
            "Mätning",
            "Resultat"
          ],

          [
            "Genomsnittliga home λ",
            avgLH.toFixed(2)
          ],

          [
            "Genomsnittliga away λ",
            avgLA.toFixed(2)
          ],

          [
            "Min home λ",
            minLH.toFixed(2)
          ],

          [
            "Max home λ",
            maxLH.toFixed(2)
          ],

          [
            "Min away λ",
            minLA.toFixed(2)
          ],

          [
            "Max away λ",
            maxLA.toFixed(2)
          ]

        ])+

        '</div>'+


        '<div class="card">'+

        '<h3>🔧 Teknisk kontroll</h3>'+

        '<p class="ok">✓ 3 040 CSV-rader kan laddas</p>'+
        '<p class="ok">✓ Datum parsas explicit</p>'+
        '<p class="ok">✓ FTHG / FTAG används</p>'+
        '<p class="ok">✓ Prediction sker före resultatet uppdaterar modellen</p>'+
        '<p class="ok">✓ Separat attack / försvar</p>'+
        '<p class="ok">✓ Rating används</p>'+
        '<p class="ok">✓ Form används</p>'+
        '<p class="ok">✓ Kalibrering använder tidigare matcher</p>'+
        '<p class="ok">✓ Edge och EV använder samma pick</p>'+
        '<p class="ok">✓ Blend-test räknar om pick och EV</p>'+
        '<p class="ok">✓ Poisson skyddad mot NaN</p>'+
        '<p class="ok">✓ Min träning per lag används</p>'+
        '<p class="ok">✓ Train / Validation / OOS är separerade</p>'+

        '</div>';


      status.textContent=
        "Klar";

    }

  )


  .catch(
    err=>{

      console.error(err);


      status.textContent=
        "Fel";


      output.innerHTML=

        '<div class="card">'+

        '<p class="err">'+
        'STARTFEL: '+
        String(
          err.message||
          err
        )+
        '</p>'+

        '<p>'+
        'Öppna F12 → Console om felet kvarstår och skicka den röda felraden.'+
        '</p>'+

        '</div>';

    }
  );

}


/* =========================================================
   KNAPP
========================================================= */

document
  .getElementById(
    "runBtn"
  )
  .addEventListener(
    "click",
    run
  );

</script>
