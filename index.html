<head>

<style>

<body>
<main>

<h1>⚽ Fotbolls AI V15.4.1</h1>

<div class="card">
<button id="runBtn">▶ Kör analys</button>
<span id="status" class="small">Redo</span>
</div>

<div class="card">
<h3>Inställningar</h3>

<div class="grid">

<label>
AI vikt
<input id="aiWeight" type="number" value="25" min="0" max="100">
</label>

Min EV %
<input id="minEV" type="number" value="7" step="0.5">
</label>

Max odds
<input id="maxOdds" type="number" value="6" step="0.1">
</label>

Min träning matcher

</label>

Form matcher

</label>

Kalibreringsfönster
<input id="calWindow" type="number" value="300" min="50">
</label>

</main>

<script>
"use strict";

const SEASONS=[
"1819",
"1920",
"2021",
"2122",
"2223",
"2324",
"2425",
"2526"
];

function num(x){
const n=Number(String(x??"").replace(",",".").trim());
return Number.isFinite(n)?n:NaN;
}

function clamp(x,a,b){
return Math.max(a,Math.min(b,x));
}

function mean(a){
return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
}


/* =========================
   CSV
========================= */

function parseCSV(text){

const rows=[];
let row=[];
let cell="";
let quote=false;

for(let i=0;i<text.length;i++){

const c=text[i];

if(c==='"'){

if(quote && text[i+1]==='"'){
cell+='"';
i++;
}else{
quote=!quote;
}

}else if(c===',' && !quote){

row.push(cell);
cell="";

}else if((c==='\n'||c==='\r')&&!quote){

if(c==='\r'&&text[i+1]==='\n')i++;

row.push(cell);
cell="";

if(row.some(v=>String(v).trim()!=="")){
rows.push(row);
}

row=[];

}else{

cell+=c;

}
}

if(cell!==""||row.length){

row.push(cell);

if(row.some(v=>String(v).trim()!=="")){
rows.push(row);
}

}

if(!rows.length)return [];

const headers=rows[0].map(x=>String(x).trim());

return rows.slice(1).map(r=>{

const o={};

headers.forEach((h,i)=>{
o[h]=r[i]??"";
});

return o;

});

}


/* =========================
   DATE
========================= */

function parseDate(v){

const s=String(v||"").trim();

if(!s)return null;

let m=s.match(
/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/
);

if(m){

let y=Number(m[3]);

if(y<100)y+=2000;

const d=new Date(
y,
Number(m[2])-1,
Number(m[1])
);

if(!isNaN(d.getTime()))return d;

}

const d=new Date(s);

return isNaN(d.getTime())?null:d;

}


/* =========================
   MATCH NORMALIZATION
========================= */

function normalize(r,season){

const home=String(r.HomeTeam||"").trim();
const away=String(r.AwayTeam||"").trim();

const date=parseDate(r.Date);

const hg=num(r.FTHG);
const ag=num(r.FTAG);

if(
!home||
!away||
!date||
!Number.isFinite(hg)||
!Number.isFinite(ag)
)return null;


/* odds priority */

const pairs=[
["AvgH","AvgD","AvgA"],
["B365H","B365D","B365A"],
["BWH","BWD","BWA"],
["WHH","WHD","WHA"]
];

let odds=null;

for(const p of pairs){

const a=p.map(k=>num(r[k]));

if(
a.every(
x=>Number.isFinite(x)&&x>1.01
)
){

odds=a;
break;

}

}

if(!odds)return null;

const ftr=
hg>ag?"H":
hg<ag?"A":
"D";

return{
season,
home,
away,
date,
hg,
ag,
ftr,
odds
};

}


/* =========================
   MARKET
========================= */

function marketProb(odds){

const inv=odds.map(o=>1/o);

const s=inv.reduce(
(a,b)=>a+b,
0
);

return inv.map(
x=>x/s
);

}


/* =========================
   POISSON
========================= */

function poissonPMF(k,lambda){

if(k===0){
return Math.exp(-lambda);
}

let p=Math.exp(-lambda);

for(let i=1;i<=k;i++){
p*=lambda/i;
}

return p;

}


function poissonProbs(lh,la){

const ph=[];
const pa=[];

for(let k=0;k<=10;k++){

ph.push(
poissonPMF(k,lh)
);

pa.push(
poissonPMF(k,la)
);

}

let H=0;
let D=0;
let A=0;

for(let h=0;h<=10;h++){

for(let a=0;a<=10;a++){

const p=ph[h]*pa[a];

if(h>a){
H+=p;
}else if(h===a){
D+=p;
}else{
A+=p;
}

}

}

const s=H+D+A;

return[
H/s,
D/s,
A/s
];

}


/* =========================
   STATE
========================= */

function freshState(){

return{

home:{
gf:0,
ga:0,
n:0,
form:[]
},

away:{
gf:0,
ga:0,
n:0,
form:[]
},

rating:0,
matches:0,
season:""

};

}


function getState(states,t){

if(!states.has(t)){
states.set(t,freshState());
}

return states.get(t);

}


function avgGF(s){

return s.n?
s.gf/s.n:
1.45;

}


function avgGA(s){

return s.n?
s.ga/s.n:
1.45;

}


/* =========================
   FORM
========================= */

function recentForm(s,n){

if(!s.form.length)return 0;

const a=s.form.slice(-n);

let w=1;
let total=0;

for(let i=a.length-1;i>=0;i--){

total+=a[i]*w;

w*=0.88;

}

const denom=
(1-Math.pow(0.88,a.length))/
(1-0.88);

return denom?
total/denom:
0;

}


/* =========================
   EXPECTED GOALS
========================= */

function expectedGoals(
sh,
sa,
leagueH,
leagueA,
formN
){

const ha=
avgGF(sh)/leagueH;

const hd=
avgGA(sh)/leagueA;

const aa=
avgGF(sa)/leagueA;

const ad=
avgGA(sa)/leagueH;


/* separate attack / defence */

let lh=
leagueH*
ha*
ad*
1.035;

let la=
leagueA*
aa*
hd;


/* form */

const fh=
recentForm(sh,formN);

const fa=
recentForm(sa,formN);

lh*=
1+
clamp(
fh,
-0.35,
0.35
)*0.035;

la*=
1+
clamp(
fa,
-0.35,
0.35
)*0.035;


/* rating */

const rd=
clamp(
(sh.rating-sa.rating)*0.025,
-0.05,
0.05
);

lh*=1+rd;
la*=1-rd;


/* safety bounds */

lh=
clamp(
lh,
0.25,
4.2
);

la=
clamp(
la,
0.20,
3.7
);

return[
lh,
la
];

}


/* =========================
   UPDATE
========================= */

function updateState(states,m){

const h=
getState(
states,
m.home
);

const a=
getState(
states,
m.away
);


/* goals */

h.gf+=m.hg;
h.ga+=m.ag;
h.n++;

a.gf+=m.ag;
a.ga+=m.hg;
a.n++;


/* form */

const hs=
m.hg>m.ag?
1:
m.hg===m.ag?
0.5:
0;

const as=
m.ag>m.hg?
1:
m.hg===m.ag?
0.5:
0;

h.form.push(hs);
a.form.push(as);

if(h.form.length>20){
h.form.shift();
}

if(a.form.length>20){
a.form.shift();
}


/* rating */

const diff=
m.hg-m.ag;

h.rating=
clamp(
h.rating+
0.035*(diff-0.15),
-1.5,
1.5
);

a.rating=
clamp(
a.rating-
0.035*(diff+0.15),
-1.5,
1.5
);

h.matches=
(h.matches||0)+1;

a.matches=
(a.matches||0)+1;

}


/* =========================
   CALIBRATION
========================= */

function calibrate(p,history){

if(!history.length){
return p.slice();
}

const k=
Math.min(
history.length,
300
);

const recent=
history.slice(-k);

const out=p.slice();

for(let i=0;i<3;i++){

let nume=0;
let den=0;

for(const x of recent){

if(
Math.abs(
x.p[i]-p[i]
)<0.08
){

nume+=x.y[i];
den++;

}

}

if(den>=20){

out[i]=
0.65*p[i]+
0.35*(nume/den);

}

}

const s=
out.reduce(
(a,b)=>a+b,
0
);

return out.map(
x=>x/s
);

}


/* =========================
   MATCH ANALYSIS
========================= */

function analyzeMatch(
m,
states,
history,
formN
){

const sh=
getState(
states,
m.home
);

const sa=
getState(
states,
m.away
);


/* 75 previous matches = 150 team-games */

const ready=
(sh.matches||0)>=75 &&
(sa.matches||0)>=75;

if(!ready){
return null;
}


/* league baseline */

const leagueH=1.50;
const leagueA=1.20;


/* expected goals */

const[
lh,
la
]=expectedGoals(
sh,
sa,
leagueH,
leagueA,
formN
);


/* AI */

let ai=
poissonProbs(
lh,
la
);

ai=
calibrate(
ai,
history
);

if(
!ai.every(
Number.isFinite
)
){
return null;
}


/* market */

const market=
marketProb(
m.odds
);


/* blend */

const aiWeight=
Number(
document.getElementById(
"aiWeight"
).value
)/100;

const mw=
1-aiWeight;

let probs=[

ai[0]*aiWeight+
market[0]*mw,

ai[1]*aiWeight+
market[1]*mw,

ai[2]*aiWeight+
market[2]*mw

];

const ps=
probs.reduce(
(a,b)=>a+b,
0
);

probs=
probs.map(
x=>x/ps
);


/* selected outcome */

let pick=0;

for(let i=1;i<3;i++){

if(
probs[i]>
probs[pick]
){
pick=i;
}

}


/*
IMPORTANT:

Edge and EV use EXACTLY
the selected outcome.
*/

const edge=
ai[pick]-
market[pick];

const ev=
probs[pick]*
m.odds[pick]-
1;

const y=[

m.ftr==="H"?1:0,

m.ftr==="D"?1:0,

m.ftr==="A"?1:0

];

return{

m,
ai,
market,
probs,
pick,
edge,
ev,
y,
lh,
la

};

}


/* =========================
   STATISTICS
========================= */

function statRow(
name,
arr
){

const bets=
arr.length;

const wins=
arr.filter(
x=>x.win
).length;

const profit=
arr.reduce(
(s,x)=>s+x.profit,
0
);

return{

name,
bets,
wins,

hit:
bets?
wins/bets:
0,

profit,

roi:
bets?
profit/bets:
0

};

}


/* =========================
   RUN
========================= */

function run(){

const output=
document.getElementById(
"output"
);

const status=
document.getElementById(
"status"
);

output.innerHTML="";

status.textContent=
"Laddar data…";

const states=
new Map();

const history=[];
const allPred=[];
const locked=[];

let loaded=0;
let analyzed=0;

Promise.all(

SEASONS.map(
async season=>{

const res=
await fetch(
"data/"+season+".csv",
{
cache:"no-store"
}
);

if(!res.ok){

throw new Error(
"Kunde inte läsa data/"+
season+
".csv ("+
res.status+
")"
);

}

return[
season,
parseCSV(
await res.text()
)
];

}

)

).then(files=>{


/* =========================
   PROCESS SEASONS
========================= */

for(
const[
season,
rows
]
of files
){

loaded+=rows.length;

const matches=
rows
.map(
r=>normalize(
r,
season
)
)
.filter(Boolean)
.sort(
(a,b)=>
a.date-b.date
);

let lastSeason="";

for(
const m of matches
){

/* season transition */

if(
m.season!==lastSeason
){

if(lastSeason){

for(
const s of states.values()
){

s.gf*=0.3;
s.ga*=0.3;

s.n=
Math.max(
0,
Math.round(
s.n*0.3
)
);

s.form=
s.form.slice(-5);

s.rating*=0.7;

}

}

lastSeason=
m.season;

}


/* predict BEFORE update */

const pred=
analyzeMatch(
m,
states,
history,
Number(
document.getElementById(
"formN"
).value
)
);

if(pred){

analyzed++;

const idx=
pred.pick;

const odds=
m.odds[idx];

const win=
pred.y[idx]===1;

const profit=
win?
odds-1:
-1;

const rec={
...pred,
win,
profit
};

allPred.push(rec);


/* main strategy */

const minEV=
Number(
document.getElementById(
"minEV"
).value
)/100;

const maxOdds=
Number(
document.getElementById(
"maxOdds"
).value
);

if(

pred.ev>=minEV &&

pred.edge>=0.10 &&
pred.edge<0.15 &&

odds<=maxOdds

){

locked.push(rec);

}


/* calibration history */

history.push({

p:
pred.ai.slice(),

y:
pred.y.slice()

});

if(
history.length>
Number(
document.getElementById(
"calWindow"
).value
)
){

history.shift();

}

}


/* update */

updateState(
states,
m
);

}

}


/* =========================
   SPLITS
========================= */

const splitDate1=
new Date(
2022,
6,
1
);

const splitDate2=
new Date(
2024,
6,
1
);

const train=
locked.filter(
x=>
x.m.date<
splitDate1
);

const validation=
locked.filter(
x=>
x.m.date>=splitDate1 &&
x.m.date<splitDate2
);

const oos=
locked.filter(
x=>
x.m.date>=splitDate2
);


/* =========================
   MAIN
========================= */

const main=
statRow(
"Huvudstrategi",
locked
);


/* =========================
   METRICS
========================= */

function metrics(arr){

if(!arr.length){

return{
acc:0,
brier:0,
ll:0
};

}

let acc=0;
let b=0;
let ll=0;

for(
const x of arr
){

const pred=
x.probs;

const actual=
x.y;

const pk=
pred.indexOf(
Math.max(
...pred
)
);

if(actual[pk]){
acc++;
}

b+=
pred.reduce(
(s,p,i)=>
s+
Math.pow(
p-actual[i],
2
),
0
);

const actualIndex=
actual.indexOf(1);

ll-=
Math.log(
Math.max(
1e-12,
pred[actualIndex]
)
);

}

return{

acc:
acc/arr.length,

brier:
b/(arr.length*3),

ll:
ll/arr.length

};

}

const met=
metrics(
allPred
);


/* =========================
   FORMAT
========================= */

function fmtPct(x){

return(
x*100
).toFixed(2)
+"%";

}


/* =========================
   TABLE
========================= */

function table(rows){

return(

"<table><tr>"+
rows[0]
.map(
x=>
"<th>"+
x+
"</th>"
)
.join("")+
"</tr>"+

rows.slice(1)
.map(
r=>
"<tr>"+
r.map(
x=>
"<td>"+
x+
"</td>"
)
.join("")+
"</tr>"
)
.join("")+

"</table>"

);

}


/* =========================
   EDGE
========================= */

const bins=[

[0,0.05],
[0.05,0.10],
[0.10,0.15],
[0.15,0.20],
[0.20,0.25],
[0.25,1.01]

];

const edgeRows=[
[
"Edge",
"Bets",
"Wins",
"ROI"
]
];

for(
const[
a,b
]
of bins
){

const q=
allPred.filter(
x=>
x.edge>=a &&
x.edge<b
);

const s=
statRow(
"",
q
);

edgeRows.push([

Math.round(a*100)+
"–"+
Math.round(b*100)+
"%",

s.bets,
s.wins,
fmtPct(s.roi)

]);

}


/* =========================
   EV
========================= */

const evs=[
0.03,
0.05,
0.07,
0.10,
0.15
];

const evRows=[

[
"EV-gräns",
"Bets",
"Wins",
"ROI"
]

];

for(
const e of evs
){

const q=
allPred.filter(
x=>
x.ev>=e
);

const s=
statRow(
"",
q
);

evRows.push([

">="+
(e*100)+
"%",

s.bets,
s.wins,
fmtPct(s.roi)

]);

}


/* =========================
   HOME BIAS
========================= */

const bias=
allPred.length?

allPred.reduce(
(s,x)=>
s+
(
x.ai[0]-
x.market[0]
),
0
)/
allPred.length:

0;


const avgLH=
allPred.length?

mean(
allPred.map(
x=>x.lh
)
):

0;


const avgLA=
allPred.length?

mean(
allPred.map(
x=>x.la
)
):

0;


/* =========================
   OUTPUT
========================= */

output.innerHTML=

'<div class="card">'+

'<h3>Resultat</h3>'+

'<div class="grid">'+

'<div>'+
'Laddade rader<br>'+
'<b>'+
loaded+
'</b>'+
'</div>'+

'<div>'+
'Analyserade matcher<br>'+
'<b>'+
analyzed+
'</b>'+
'</div>'+

'<div>'+
'Accuracy<br>'+
'<b>'+
fmtPct(met.acc)+
'</b>'+
'</div>'+

'<div>'+
'Brier<br>'+
'<b>'+
met.brier.toFixed(4)+
'</b>'+
'</div>'+

'<div>'+
'Log Loss<br>'+
'<b>'+
met.ll.toFixed(4)+
'</b>'+
'</div>'+

'</div>'+

'</div>'+

'<div class="card">'+

'<h3>Huvudstrategi</h3>'+

'<p>'+
'AI 25% / Market 75% · '+
'Edge 10–15% · '+
'EV ≥ 7% · '+
'Max odds 6'+
'</p>'+

table([

[
"Bets",
"Wins",
"Hit",
"Profit",
"ROI"
],

[
main.bets,
main.wins,
fmtPct(main.hit),
main.profit.toFixed(2)+" kr",
fmtPct(main.roi)
]

])+

'</div>'+

'<div class="card">'+

'<h3>Train / Validation / OOS</h3>'+

table([

[
"Period",
"Bets",
"Wins",
"ROI"
],

[
"Train",
train.length,
train.filter(
x=>x.win
).length,
fmtPct(
statRow(
"",
train
).roi
)
],

[
"Validation",
validation.length,
validation.filter(
x=>x.win
).length,
fmtPct(
statRow(
"",
validation
).roi
)
],

[
"OOS",
oos.length,
oos.filter(
x=>x.win
).length,
fmtPct(
statRow(
"",
oos
).roi
)
]

])+

'</div>'+

'<div class="card">'+

'<h3>Edge-zoner</h3>'+

table(
edgeRows
)+

'</div>'+

'<div class="card">'+

'<h3>EV-zoner</h3>'+

table(
evRows
)+

'</div>'+

'<div class="card">'+

'<h3>Home-bias diagnostik</h3>'+

'<p>'+
'Genomsnittlig AI-home edge mot marknaden: '+
'<b>'+
fmtPct(bias)+
'</b>'+
'</p>'+

'<p>'+
'Genomsnittliga Poisson-mål: '+
'<b>'+
avgLH.toFixed(2)+
' – '+
avgLA.toFixed(2)+
'</b>'+
'</p>'+

'</div>'+

'<div class="card">'+

'<h3>Teknisk kontroll</h3>'+

'<p class="ok">'+
'✓ CSV laddas korrekt'+
'</p>'+

'<p class="ok">'+
'✓ Explicit datumtolkning'+
'</p>'+

'<p class="ok">'+
'✓ FTHG/FTAG används'+
'</p>'+

'<p class="ok">'+
'✓ Samma val används för Edge och EV'+
'</p>'+

'<p class="ok">'+
'✓ Poisson utan NaN'+
'</p>'+

'</div>';

status.textContent=
"Klar";

}).catch(
err=>{

console.error(err);

status.textContent=
"Fel";

output.innerHTML=

'<div class="card">'+

'<p class="err">'+

'STARTFEL: '+
String(
err.message||err
)+

'</p>'+

'<p>'+
'Kontrollera webbläsarens Console (F12) om felet kvarstår.'+
'</p>'+

'</div>';

}

);

}


/* =========================
   BUTTON
========================= */

document
.getElementById("runBtn")
.addEventListener(
"click",
run
);

</script>
