<script>

const DATA_BASE="data/";

const seasons={
2018:"1819",
2019:"1920",
2020:"2021",
2021:"2122",
2022:"2223",
2023:"2324",
2024:"2425",
2025:"2526"
};


/* =====================================================
CSV-PARSER
===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quote=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];
    const n=text[i+1];

    if(c==='"'){

      if(quote && n==='"'){
        cell+='"';
        i++;
      }else{
        quote=!quote;
      }

    }else if(c===','&&!quote){

      row.push(cell.trim());
      cell="";

    }else if(
      (c==='\n'||c==='\r')&&!quote
    ){

      if(c==='\r'&&n==='\n')i++;

      row.push(cell.trim());
      cell="";

      if(row.some(x=>x!=="")){
        rows.push(row);
      }

      row=[];

    }else{

      cell+=c;

    }

  }

  if(row.length||cell){

    row.push(cell.trim());

    if(row.some(x=>x!=="")){
      rows.push(row);
    }

  }

  if(!rows.length)return[];

  const headers=rows[0];

  return rows.slice(1).map(r=>{

    const o={};

    headers.forEach((h,i)=>{
      o[h]=r[i]||"";
    });

    return o;

  });
}


/* =====================================================
HJÄLP
===================================================== */

function num(v){

  if(
    v===undefined||
    v===null||
    v===""
  ){
    return null;
  }

  const n=parseFloat(
    String(v).replace(",",".")
  );

  return Number.isFinite(n)?n:null;
}


function dateSort(v){

  if(!v)return 0;

  const p=String(v).split("/");

  if(p.length===3){

    let d=parseInt(p[0]);
    let m=parseInt(p[1]);
    let y=parseInt(p[2]);

    if(y<100)y+=2000;

    return new Date(
      y,m-1,d
    ).getTime();

  }

  const t=new Date(v).getTime();

  return Number.isFinite(t)?t:0;
}


/* =====================================================
ODDS
===================================================== */

function getOdds(row){

  const h=
    num(row.B365H) ??
    num(row.BWH) ??
    num(row.WHH) ??
    num(row.AvgH);

  const d=
    num(row.B365D) ??
    num(row.BWD) ??
    num(row.WHD) ??
    num(row.AvgD);

  const a=
    num(row.B365A) ??
    num(row.BWA) ??
    num(row.WHA) ??
    num(row.AvgA);

  if(
    h===null||
    d===null||
    a===null
  ){
    return null;
  }

  if(
    h<=1||
    d<=1||
    a<=1
  ){
    return null;
  }

  const ih=1/h;
  const id=1/d;
  const ia=1/a;

  const total=ih+id+ia;

  return{

    odds:[h,d,a],

    probabilities:[
      ih/total,
      id/total,
      ia/total
    ]

  };
}


/* =====================================================
POISSON
===================================================== */

function poisson(k,l){

  let p=Math.exp(-l);

  for(let i=1;i<=k;i++){
    p*=l/i;
  }

  return p;
}


function modelProb(h,a){

  let home=0;
  let draw=0;
  let away=0;

  for(let hg=0;hg<=10;hg++){

    for(let ag=0;ag<=10;ag++){

      const p=
        poisson(hg,h)*
        poisson(ag,a);

      if(hg>ag){
        home+=p;
      }else if(hg===ag){
        draw+=p;
      }else{
        away+=p;
      }

    }

  }

  const total=
    home+draw+away;

  return[
    home/total,
    draw/total,
    away/total
  ];
}


/* =====================================================
LAGSTATISTIK
===================================================== */

function addTeam(stats,team,gf,ga){

  if(!stats[team]){

    stats[team]={
      gf:0,
      ga:0,
      n:0,
      recent:[]
    };

  }

  stats[team].gf+=gf;
  stats[team].ga+=ga;
  stats[team].n++;

  stats[team].recent.push({
    gf,
    ga
  });

  if(stats[team].recent.length>10){
    stats[team].recent.shift();
  }

}


function formStats(team){

  if(
    !team||
    !team.recent||
    !team.recent.length
  ){

    return{
      gf:0,
      ga:0
    };

  }

  let gf=0;
  let ga=0;

  for(const x of team.recent){

    gf+=x.gf;
    ga+=x.ga;

  }

  return{

    gf:
      gf/team.recent.length,

    ga:
      ga/team.recent.length

  };

}


/* =====================================================
SKAPA MODELLSIGNALER
===================================================== */

function buildSignals(matches){

  const stats={};

  const signals=[];

  let ready=0;


  for(const m of matches){

    const hs=stats[m.home];
    const as=stats[m.away];


    if(
      hs &&
      as &&
      hs.n>=5 &&
      as.n>=5 &&
      m.odds
    ){

      ready++;


      const hf=formStats(hs);
      const af=formStats(as);

      const leagueGoals=1.35;


      let homeAttack=
        (hs.gf/hs.n)/leagueGoals;

      let homeDefense=
        (hs.ga/hs.n)/leagueGoals;

      let awayAttack=
        (as.gf/as.n)/leagueGoals;

      let awayDefense=
        (as.ga/as.n)/leagueGoals;


      /*
        30 % senaste form.
      */

      const fw=.30;


      homeAttack=
        homeAttack*(1-fw)+
        (hf.gf/leagueGoals)*fw;

      homeDefense=
        homeDefense*(1-fw)+
        (hf.ga/leagueGoals)*fw;

      awayAttack=
        awayAttack*(1-fw)+
        (af.gf/leagueGoals)*fw;

      awayDefense=
        awayDefense*(1-fw)+
        (af.ga/leagueGoals)*fw;


      let hLambda=
        leagueGoals*
        homeAttack*
        awayDefense*
        1.08;


      let aLambda=
        leagueGoals*
        awayAttack*
        homeDefense;


      hLambda=Math.max(
        .15,
        Math.min(4.5,hLambda)
      );

      aLambda=Math.max(
        .15,
        Math.min(4.5,aLambda)
      );


      const model=
        modelProb(
          hLambda,
          aLambda
        );


      const market=
        m.odds.probabilities;


      let result="";

      if(m.hg>m.ag){
        result="H";
      }else if(m.hg===m.ag){
        result="D";
      }else{
        result="A";
      }


      for(let i=0;i<3;i++){

        signals.push({

          season:m.season,

          date:m.date,

          home:m.home,

          away:m.away,

          outcome:i,

          outcomeName:
            i===0
            ?"Hemma"
            :i===1
              ?"Kryss"
              :"Borta",

          model:model[i],

          market:market[i],

          edge:
            model[i]-market[i],

          odds:m.odds.odds[i],

          won:
            (
              i===0&&result==="H"
            )||
            (
              i===1&&result==="D"
            )||
            (
              i===2&&result==="A"
            ),

          actual:result

        });

      }

    }


    /*
      Uppdatera först efter matchen.
    */

    addTeam(
      stats,
      m.home,
      m.hg,
      m.ag
    );

    addTeam(
      stats,
      m.away,
      m.ag,
      m.hg
    );

  }


  return{
    signals,
    ready
  };

}


/* =====================================================
KALIBRERING
===================================================== */

function calibration(arr){

  const bins=[
    [0.30,0.40],
    [0.40,0.50],
    [0.50,0.60],
    [0.60,0.70],
    [0.70,0.80],
    [0.80,0.90],
    [0.90,1.01]
  ];


  return bins.map(b=>{

    const x=
      arr.filter(
        s=>
          s.model>=b[0]&&
          s.model<b[1]
      );


    let wins=0;

    for(const s of x){

      if(s.won)wins++;

    }


    const actual=
      x.length
      ?wins/x.length
      :0;


    const avg=
      x.length
      ?x.reduce(
        (sum,s)=>sum+s.model,
        0
      )/x.length
      :0;


    return{

      low:b[0],
      high:b[1],

      bets:x.length,

      wins,

      predicted:avg*100,

      actual:actual*100,

      difference:
        (actual-avg)*100

    };

  });

}


/* =====================================================
ROI
===================================================== */

function bettingStats(arr){

  let profit=0;
  let wins=0;

  for(const s of arr){

    if(s.won){

      wins++;

      profit+=
        s.odds-1;

    }else{

      profit-=1;

    }

  }


  return{

    bets:arr.length,

    wins,

    hit:
      arr.length
      ?wins/arr.length*100
      :0,

    profit,

    roi:
      arr.length
      ?profit/arr.length*100
      :0

  };

}


/* =====================================================
V7
===================================================== */

async function runV7(){

  const button=
    document.getElementById("run");

  const status=
    document.getElementById("status");

  const result=
    document.getElementById("result");


  button.disabled=true;

  result.innerHTML="";


  try{

    const from=
      parseInt(
        document.getElementById("from").value
      );

    const to=
      parseInt(
        document.getElementById("to").value
      );

    const testFrom=
      parseInt(
        document.getElementById("testFrom").value
      );


    if(from>to){
      throw new Error(
        "Felaktigt säsongsintervall."
      );
    }


    if(
      testFrom<from||
      testFrom>to
    ){

      throw new Error(
        "Out-of-sample måste ligga inom valt intervall."
      );

    }


    let matches=[];


    /* ================================================
       DATA
       ================================================ */

    for(
      let season=from;
      season<=to;
      season++
    ){

      status.textContent=
        "⏳ Hämtar "+
        season+
        "/"+
        String(season+1).slice(2);


      const response=
        await fetch(
          DATA_BASE+
          seasons[season]+
          ".csv",
          {cache:"no-store"}
        );


      if(!response.ok){

        throw new Error(
          "Kunde inte läsa data/"+
          seasons[season]+
          ".csv"
        );

      }


      const rows=
        parseCSV(
          await response.text()
        );


      for(const row of rows){

        const hg=num(row.FTHG);
        const ag=num(row.FTAG);


        if(
          hg===null||
          ag===null||
          !row.HomeTeam||
          !row.AwayTeam
        ){
          continue;
        }


        matches.push({

          season,

          date:row.Date,

          sortDate:
            dateSort(row.Date),

          home:row.HomeTeam,

          away:row.AwayTeam,

          hg,

          ag,

          odds:getOdds(row)

        });

      }

    }


    matches.sort(
      (a,b)=>
        a.sortDate-b.sortDate
    );


    status.textContent=
      "🧠 Beräknar modell...";


    const built=
      buildSignals(matches);


    const signals=
      built.signals;


    /*
      Endast modellens bästa utfall
      per match används i bettingdelen.
    */

    const bestByMatch={};


    for(const s of signals){

      const key=
        s.season+
        "|" +
        s.date+
        "|" +
        s.home+
        "|" +
        s.away;


      if(
        !bestByMatch[key]||
        s.edge>
        bestByMatch[key].edge
      ){

        bestByMatch[key]=s;

      }

    }


    const bestSignals=
      Object.values(
        bestByMatch
      );


    /* ================================================
       TRAIN / TEST
       ================================================ */

    const train=
      signals.filter(
        s=>s.season<testFrom
      );

    const test=
      signals.filter(
        s=>s.season>=testFrom
      );


    const trainBest=
      bestSignals.filter(
        s=>s.season<testFrom
      );

    const testBest=
      bestSignals.filter(
        s=>s.season>=testFrom
      );


    /* ================================================
       OUTPUT
       ================================================ */

    let html="";


    html+=
      "<h2>🔎 Räckvidd</h2>";


    html+=
      "<pre>"+
      "Matcher totalt: "+matches.length+"\n"+
      "Matcher där modellen var redo: "+built.ready+"\n"+
      "1X2-signaler: "+signals.length+"\n"+
      "Unika matcher med odds: "+bestSignals.length+"\n"+
      "</pre>";


    /* ================================================
       TRÄNING / TEST
       ================================================ */

    html+=
      "<h2>🧪 Träning vs Out-of-sample</h2>";


    const trainStats=
      bettingStats(trainBest);

    const testStats=
      bettingStats(testBest);


    html+=
      "<table>"+
      "<tr>"+
      "<th></th>"+
      "<th>Träning</th>"+
      "<th>Out-of-sample</th>"+
      "</tr>"+

      "<tr>"+
      "<td>Matcher</td>"+
      "<td>"+trainBest.length+"</td>"+
      "<td>"+testBest.length+"</td>"+
      "</tr>"+

      "<tr>"+
      "<td>Spel</td>"+
      "<td>"+trainStats.bets+"</td>"+
      "<td>"+testStats.bets+"</td>"+
      "</tr>"+

      "<tr>"+
      "<td>Träff</td>"+
      "<td>"+trainStats.hit.toFixed(2)+"%</td>"+
      "<td>"+testStats.hit.toFixed(2)+"%</td>"+
      "</tr>"+

      "<tr>"+
      "<td>ROI</td>"+
      "<td>"+trainStats.roi.toFixed(2)+"%</td>"+
      "<td>"+testStats.roi.toFixed(2)+"%</td>"+
      "</tr>"+

      "<tr>"+
      "<td>Resultat</td>"+
      "<td>"+trainStats.profit.toFixed(2)+" kr</td>"+
      "<td>"+testStats.profit.toFixed(2)+" kr</td>"+
      "</tr>"+

      "</table>";


    /* ================================================
       KALIBRERING
       ================================================ */

    html+=
      "<h2>🎯 Kalibrering – träning</h2>";


    html+=
      calibrationTable(
        calibration(train)
      );


    html+=
      "<h2>🎯 Kalibrering – out-of-sample</h2>";


    html+=
      calibrationTable(
        calibration(test)
      );


    /* ================================================
       EDGE
       ================================================ */

    const edgeLevels=[
      .00,
      .01,
      .02,
      .03,
      .05,
      .10
    ];


    html+=
      "<h2>📊 Edge – out-of-sample</h2>";


    html+=
      "<table>"+
      "<tr>"+
      "<th>Edge</th>"+
      "<th>Spel</th>"+
      "<th>Träff</th>"+
      "<th>ROI</th>"+
      "<th>Resultat</th>"+
      "</tr>";


    for(const edge of edgeLevels){

      const arr=
        testBest.filter(
          s=>s.edge>=edge
        );


      const st=
        bettingStats(arr);


      html+=
        "<tr>"+
        "<td>≥ "+(edge*100).toFixed(0)+"%</td>"+
        "<td>"+st.bets+"</td>"+
        "<td>"+st.hit.toFixed(2)+"%</td>"+
        "<td>"+st.roi.toFixed(2)+"%</td>"+
        "<td>"+st.profit.toFixed(2)+" kr</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       1X2 OUT OF SAMPLE
       ================================================ */

    html+=
      "<h2>⚽ 1X2 – out-of-sample</h2>";


    html+=
      "<table>"+
      "<tr>"+
      "<th>Val</th>"+
      "<th>Spel</th>"+
      "<th>Träff</th>"+
      "<th>ROI</th>"+
      "</tr>";


    for(const outcome of [0,1,2]){

      const arr=
        testBest.filter(
          s=>s.outcome===outcome
        );


      const st=
        bettingStats(arr);


      html+=
        "<tr>"+
        "<td>"+
        (
          outcome===0
          ?"Hemma"
          :outcome===1
            ?"Kryss"
            :"Borta"
        )+
        "</td>"+
        "<td>"+st.bets+"</td>"+
        "<td>"+st.hit.toFixed(2)+"%</td>"+
        "<td>"+st.roi.toFixed(2)+"%</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       STÖRSTA SIGNALER
       ================================================ */

    html+=
      "<h2>🔥 Starkaste out-of-sample-signalerna</h2>";


    const top=
      [...testBest]
      .sort(
        (a,b)=>b.edge-a.edge
      )
      .slice(0,30);


    html+=
      "<table>"+
      "<tr>"+
      "<th>Match</th>"+
      "<th>Val</th>"+
      "<th>Modell</th>"+
      "<th>Marknad</th>"+
      "<th>Edge</th>"+
      "<th>Odds</th>"+
      "<th></th>"+
      "</tr>";


    for(const s of top){

      html+=
        "<tr>"+
        "<td>"+s.home+" - "+s.away+"</td>"+
        "<td>"+s.outcomeName+"</td>"+
        "<td>"+(s.model*100).toFixed(1)+"%</td>"+
        "<td>"+(s.market*100).toFixed(1)+"%</td>"+
        "<td>"+(s.edge*100).toFixed(2)+"%</td>"+
        "<td>"+s.odds.toFixed(2)+"</td>"+
        "<td>"+(s.won?"✅":"❌")+"</td>"+
        "</tr>";

    }


    html+="</table>";


    /* ================================================
       SLUTSATS
       ================================================ */

    html+=
      "<h2>🧠 V7 Slutsats</h2>";


    html+=
      "<pre>"+
      "Träningsperiod: "+
      from+
      "/"+
      String(from+1).slice(2)+
      " → "+
      (testFrom-1)+
      "/"+
      String(testFrom).slice(2)+
      "\n"+

      "Out-of-sample börjar: "+
      testFrom+
      "/"+
      String(testFrom+1).slice(2)+
      "\n\n"+

      "V7 försöker besvara en viktig fråga:\n"+
      "Är modellens sannolikheter realistiska även på\n"+
      "matcher som modellen inte har optimerats mot?\n"+
      "</pre>";


    html+=
      "<p class='note'>"+
      "Viktigt: V7 är fortfarande ett historiskt test. "+
      "Ett positivt resultat betyder inte att framtida matcher "+
      "kommer att ge positiv avkastning. "+
      "Flera testnivåer på samma historik kan också skapa "+
      "överanpassning."+
      "</p>";


    result.innerHTML=html;


    status.textContent=
      "✅ V7 klart – "+
      matches.length+
      " matcher analyserade.";

    status.className="good";

  }
  catch(error){

    status.textContent="❌ Fel";

    status.className="warn";

    result.innerHTML=
      "<pre>"+
      error.message+
      "</pre>";

  }
  finally{

    button.disabled=false;

  }

}


/* =====================================================
KALIBRERINGSTABELL
===================================================== */

function calibrationTable(rows){

  let html=
    "<table>"+
    "<tr>"+
    "<th>Modellintervall</th>"+
    "<th>Antal</th>"+
    "<th>Förutspått</th>"+
    "<th>Verkligt</th>"+
    "<th>Skillnad</th>"+
    "</tr>";


  for(const r of rows){

    html+=
      "<tr>"+
      "<td>"+
      (r.low*100).toFixed(0)+
      "–"+
      (r.high*100).toFixed(0)+
      "%</td>"+

      "<td>"+r.bets+"</td>"+

      "<td>"+
      r.predicted.toFixed(1)+
      "%</td>"+

      "<td>"+
      r.actual.toFixed(1)+
      "%</td>"+

      "<td>"+
      (r.difference>=0?"+":"")+
      r.difference.toFixed(1)+
      " %-enheter"+
      "</td>"+

      "</tr>";

  }


  html+="</table>";

  return html;

}

</script>

</body>
</html>
