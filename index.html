<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fotbolls-AI Backtest V3</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px;
}

.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  font-size:16px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:7px;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  font-size:17px;
  font-weight:bold;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
}

button:disabled{
  opacity:.5;
}

#status{
  margin-top:15px;
  padding:12px;
  background:#eee;
  border-radius:8px;
}

.good{
  background:#e5f7e5!important;
}

.bad{
  background:#ffe5e5!important;
}

pre{
  white-space:pre-wrap;
  font-family:Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>⚽ Fotbolls-AI Backtest V3</h1>

<label>Startkapital (kr)</label>
<input id="capital" type="number" value="1" step="0.01">

<label>Max insats per kalenderdag (kr)</label>
<input id="daily" type="number" value="1" step="0.01">

<label>Mål (kr)</label>
<input id="target" type="number" value="10000" step="1">

<label>Minsta edge (%)</label>
<input id="edge" type="number" value="5" step="0.1">

<label>Första säsong</label>
<select id="from">
<option value="2018">2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025" selected>2025/26</option>
</select>

<label>Sista säsong</label>
<select id="to">
<option value="2018">2018/19</option>
<option value="2019">2019/20</option>
<option value="2020">2020/21</option>
<option value="2021">2021/22</option>
<option value="2022">2022/23</option>
<option value="2023">2023/24</option>
<option value="2024">2024/25</option>
<option value="2025" selected>2025/26</option>
</select>

<button id="run" onclick="runBacktest()">
LADDA DATA & KÖR BACKTEST
</button>

<div id="status">Redo.</div>

<pre id="result"></pre>

</div>

<script>

const BASE =
"https://www.football-data.co.uk/mmz4281/";

const seasons = {
  2018:"1819",
  2019:"1920",
  2020:"2021",
  2021:"2122",
  2022:"2223",
  2023:"2324",
  2024:"2425",
  2025:"2526"
};


/* =========================
   CSV
========================= */

function parseCSV(text){

  const lines =
    text.replace(/\r/g,"").split("\n");

  if(!lines.length) return [];

  const headers =
    lines[0].split(",").map(x=>x.trim());

  return lines.slice(1).map(line=>{

    if(!line.trim()) return null;

    const vals = line.split(",");
    const obj = {};

    headers.forEach((h,i)=>{
      obj[h] = (vals[i] || "").trim();
    });

    return obj;

  }).filter(Boolean);
}


/* =========================
   HÄMTA DATA
========================= */

async function fetchCSV(url){

  const proxies = [

    "https://api.allorigins.win/raw?url="
      + encodeURIComponent(url),

    "https://api.allorigins.win/get?url="
      + encodeURIComponent(url)

  ];

  let lastError = null;

  for(const proxy of proxies){

    try{

      const response =
        await fetch(proxy,{cache:"no-store"});

      if(!response.ok){
        throw new Error(
          "HTTP "+response.status
        );
      }

      let text =
        await response.text();

      /*
        allOrigins /get kan returnera
        JSON med CSV:n i contents.
      */

      if(text.trim().startsWith("{")){

        try{

          const json =
            JSON.parse(text);

          if(json.contents){
            text = json.contents;
          }

        }catch(e){}

      }

      if(text && text.length > 100){
        return text;
      }

    }catch(error){

      lastError = error;

    }

  }

  throw lastError ||
    new Error("Kunde inte hämta data.");
}


/* =========================
   NUMMER
========================= */

function num(value){

  const n = parseFloat(value);

  return Number.isFinite(n)
    ? n
    : null;
}


/* =========================
   DATUM
========================= */

function dateValue(value){

  if(!value) return 0;

  const parts =
    value.split("/");

  if(parts.length === 3){

    let day =
      parseInt(parts[0]);

    let month =
      parseInt(parts[1]);

    let year =
      parseInt(parts[2]);

    if(year < 100){
      year += 2000;
    }

    return new Date(
      year,
      month-1,
      day
    ).getTime();
  }

  const t =
    new Date(value).getTime();

  return Number.isFinite(t)
    ? t
    : 0;
}


/* =========================
   POISSON
========================= */

function poisson(k,lambda){

  if(lambda <= 0) return 0;

  let p =
    Math.exp(-lambda);

  for(let i=1;i<=k;i++){

    p *= lambda/i;

  }

  return p;
}


/* =========================
   MODELLENS SANNOLIKHETER
========================= */

function modelProbabilities(
  homeLambda,
  awayLambda
){

  let home = 0;
  let draw = 0;
  let away = 0;

  /*
    Vi räknar mål 0-8.
  */

  for(let h=0;h<=8;h++){

    for(let a=0;a<=8;a++){

      const p =
        poisson(h,homeLambda) *
        poisson(a,awayLambda);

      if(h>a){
        home += p;
      }
      else if(h===a){
        draw += p;
      }
      else{
        away += p;
      }

    }

  }

  const total =
    home+draw+away;

  return [
    home/total,
    draw/total,
    away/total
  ];
}


/* =========================
   MARKNADENS ODDS
========================= */

function getOdds(row){

  /*
    Prioritering:
    Bet365 -> Betway -> William Hill -> Average
  */

  const home =
    num(row.B365H) ??
    num(row.BWH) ??
    num(row.WHH) ??
    num(row.AvgH);

  const draw =
    num(row.B365D) ??
    num(row.BWD) ??
    num(row.WHD) ??
    num(row.AvgD);

  const away =
    num(row.B365A) ??
    num(row.BWA) ??
    num(row.WHA) ??
    num(row.AvgA);

  if(
    home===null ||
    draw===null ||
    away===null
  ){
    return null;
  }

  if(
    home<=1 ||
    draw<=1 ||
    away<=1
  ){
    return null;
  }

  return {
    odds:[home,draw,away],

    /*
      Normaliserade marknadssannolikheter.
    */

    probabilities:(()=>{

      const ih=1/home;
      const id=1/draw;
      const ia=1/away;

      const total =
        ih+id+ia;

      return [
        ih/total,
        id/total,
        ia/total
      ];

    })()
  };
}


/* =========================
   LAGSTATISTIK
========================= */

function addTeam(
  stats,
  team,
  goalsFor,
  goalsAgainst
){

  if(!stats[team]){

    stats[team] = {
      gf:0,
      ga:0,
      n:0
    };

  }

  stats[team].gf += goalsFor;
  stats[team].ga += goalsAgainst;
  stats[team].n++;

}


/* =========================
   HUVUDFUNKTION
========================= */

async function runBacktest(){

  const button =
    document.getElementById("run");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  button.disabled = true;

  result.textContent = "";

  status.className = "";

  try{

    const from =
      parseInt(
        document.getElementById("from").value
      );

    const to =
      parseInt(
        document.getElementById("to").value
      );

    if(from > to){

      throw new Error(
        "Första säsong måste vara före sista säsong."
      );

    }


    /* =========================
       INSTÄLLNINGAR
    ========================= */

    const startCapital =
      num(
        document.getElementById("capital").value
      ) || 1;

    const dailyLimit =
      num(
        document.getElementById("daily").value
      ) || 1;

    const target =
      num(
        document.getElementById("target").value
      ) || 10000;

    const minEdge =
      (
        num(
          document.getElementById("edge").value
        ) || 5
      ) / 100;


    /* =========================
       HÄMTA MATCHER
    ========================= */

    let matches = [];

    for(
      let season=from;
      season<=to;
      season++
    ){

      status.textContent =
        "⏳ Hämtar säsong " +
        season +
        "/" +
        String(season+1).slice(2) +
        "...";

      const url =
        BASE +
        seasons[season] +
        "/E0.csv";

      const csv =
        await fetchCSV(url);

      const rows =
        parseCSV(csv);


      for(const row of rows){

        const homeGoals =
          num(row.FTHG);

        const awayGoals =
          num(row.FTAG);

        if(
          homeGoals===null ||
          awayGoals===null
        ){
          continue;
        }

        if(
          !row.HomeTeam ||
          !row.AwayTeam
        ){
          continue;
        }

        const odds =
          getOdds(row);

        matches.push({

          date:row.Date,

          time:
            dateValue(row.Date),

          home:
            row.HomeTeam,

          away:
            row.AwayTeam,

          homeGoals:
            homeGoals,

          awayGoals:
            awayGoals,

          odds:odds

        });

      }

    }


    matches.sort(
      (a,b)=>a.time-b.time
    );


    if(!matches.length){

      throw new Error(
        "Inga matcher hittades."
      );

    }


    status.textContent =
      "🧠 Kör modellen på " +
      matches.length +
      " matcher...";


    /* =========================
       STARTVÄRDEN
    ========================= */

    const stats = {};

    let capital =
      startCapital;

    let bets = 0;

    let wins = 0;

    let totalStaked = 0;

    let profit = 0;

    let maxCapital =
      capital;

    let targetReached = null;

    let currentDay = "";

    let dailyStake = 0;


    /*
      Statistik per utfall.
    */

    const outcomeStats = {

      home:{
        bets:0,
        wins:0,
        profit:0
      },

      draw:{
        bets:0,
        wins:0,
        profit:0
      },

      away:{
        bets:0,
        wins:0,
        profit:0
      }

    };


    /* =========================
       BACKTEST
    ========================= */

    for(const match of matches){

      /*
        Ny kalenderdag.
      */

      if(match.date !== currentDay){

        currentDay =
          match.date;

        dailyStake = 0;

      }


      const homeStats =
        stats[match.home];

      const awayStats =
        stats[match.away];


      /*
        Kräver minst 5 tidigare matcher
        för båda lagen.
      */

      if(
        homeStats &&
        awayStats &&
        homeStats.n>=5 &&
        awayStats.n>=5 &&
        match.odds
      ){

        /*
          Genomsnittlig målproduktion.
        */

        const leagueGoals =
          1.35;


        const homeAttack =
          (
            homeStats.gf /
            homeStats.n
          ) / leagueGoals;


        const homeDefense =
          (
            homeStats.ga /
            homeStats.n
          ) / leagueGoals;


        const awayAttack =
          (
            awayStats.gf /
            awayStats.n
          ) / leagueGoals;


        const awayDefense =
          (
            awayStats.ga /
            awayStats.n
          ) / leagueGoals;


        /*
          Förväntade mål.

          1.08 = enkel hemmafördel.
        */

        let homeLambda =
          leagueGoals *
          homeAttack *
          awayDefense *
          1.08;


        let awayLambda =
          leagueGoals *
          awayAttack *
          homeDefense;


        /*
          Skydd mot extrema värden.
        */

        homeLambda =
          Math.max(
            0.15,
            Math.min(
              4.5,
              homeLambda
            )
          );


        awayLambda =
          Math.max(
            0.15,
            Math.min(
              4.5,
              awayLambda
            )
          );


        /*
          Modellens sannolikheter.
        */

        const model =
          modelProbabilities(
            homeLambda,
            awayLambda
          );


        /*
          Marknadens normaliserade sannolikheter.
        */

        const market =
          match.odds.probabilities;


        /*
          Edge = modellens sannolikhet
               minus marknadens.
        */

        let bestEdge =
          -Infinity;

        let pick = -1;


        for(
          let i=0;
          i<3;
          i++
        ){

          const edge =
            model[i]-market[i];

          if(edge > bestEdge){

            bestEdge =
              edge;

            pick = i;

          }

        }


        /*
          Bara spela om edge
          överstiger gränsen.
        */

        if(
          pick>=0 &&
          bestEdge>=minEdge &&
          dailyStake<dailyLimit
        ){

          /*
            Max 1 kr per spel som standard,
            men aldrig mer än dagens gräns
            eller tillgängligt kapital.
          */

          const stake =
            Math.min(
              1,
              dailyLimit-dailyStake,
              Math.max(0,capital)
            );


          if(stake>0){

            /*
              RIKTIGA ODDS från datan.
            */

            const selectedOdds =
              match.odds.odds[pick];


            let won = false;


            if(pick===0){

              won =
                match.homeGoals >
                match.awayGoals;

            }

            if(pick===1){

              won =
                match.homeGoals ===
                match.awayGoals;

            }

            if(pick===2){

              won =
                match.homeGoals <
                match.awayGoals;

            }


            /*
              Bokför insatsen.
            */

            capital -= stake;

            dailyStake += stake;

            totalStaked += stake;

            bets++;


            const key =
              pick===0
                ? "home"
                : pick===1
                  ? "draw"
                  : "away";


            outcomeStats[key].bets++;


            if(won){

              wins++;

              const winnings =
                stake *
                selectedOdds;

              capital += winnings;

              const betProfit =
                stake *
                (selectedOdds-1);

              profit +=
                betProfit;

              outcomeStats[key].wins++;

              outcomeStats[key].profit +=
                betProfit;

            }else{

              profit -= stake;

              outcomeStats[key].profit -=
                stake;

            }


            maxCapital =
              Math.max(
                maxCapital,
                capital
              );


            /*
              Kontrollera mål.
            */

            if(
              targetReached===null &&
              capital>=target
            ){

              targetReached =
                match.date;

            }

          }

        }

      }


      /*
        Lägg till matchen i lagens
        historik EFTER att matchen
        analyserats.

        Detta förhindrar look-ahead bias.
      */

      addTeam(
        stats,
        match.home,
        match.homeGoals,
        match.awayGoals
      );


      addTeam(
        stats,
        match.away,
        match.awayGoals,
        match.homeGoals
      );

    }


    /* =========================
       RESULTAT
    ========================= */

    const roi =
      totalStaked>0
        ? profit /
          totalStaked *
          100
        : 0;


    const hitRate =
      bets>0
        ? wins /
          bets *
          100
        : 0;


    const averageStake =
      bets>0
        ? totalStaked /
          bets
        : 0;


    status.textContent =
      "✅ Backtest klart.";

    status.className =
      "good";


    result.textContent =

`RESULTAT
══════════════════════════════

Period:
${from}/${String(from+1).slice(2)}
–
${to}/${String(to+1).slice(2)}

Matcher analyserade:
${matches.length}

Antal spel:
${bets}

Vunna spel:
${wins}

Förlorade spel:
${bets-wins}

Träffsäkerhet:
${hitRate.toFixed(2)} %

══════════════════════════════

STARTKAPITAL
${startCapital.toFixed(2)} kr

SLUTKAPITAL
${capital.toFixed(2)} kr

MAX KAPITAL
${maxCapital.toFixed(2)} kr

TOTALT SATSAT
${totalStaked.toFixed(2)} kr

GENOMSNITTLIG INSATS
${averageStake.toFixed(2)} kr

RESULTAT
${profit.toFixed(2)} kr

ROI
${roi.toFixed(2)} %

══════════════════════════════

MÅL
${target.toFixed(2)} kr

MÅLET NÅDDES
${targetReached || "NEJ"}

══════════════════════════════

UTFALL

HEMMA:
Spel: ${outcomeStats.home.bets}
Vunna: ${outcomeStats.home.wins}
Resultat: ${outcomeStats.home.profit.toFixed(2)} kr

KRYSS:
Spel: ${outcomeStats.draw.bets}
Vunna: ${outcomeStats.draw.wins}
Resultat: ${outcomeStats.draw.profit.toFixed(2)} kr

BORTA:
Spel: ${outcomeStats.away.bets}
Vunna: ${outcomeStats.away.wins}
Resultat: ${outcomeStats.away.profit.toFixed(2)} kr

══════════════════════════════

MODELL

Poisson-baserad modell
Historiska lagprestationer
Minst 5 tidigare matcher
Hemmafördel inkluderad
Marknadens sannolikheter normaliserade
Endast spel över vald edge

══════════════════════════════

⚠️ VIKTIGT

Detta är ett historiskt backtest
för forskning och simulering.

Resultatet är ingen garanti för
framtida resultat och systemet
placerar inga riktiga spel.

Historiska data:
Football-Data.co.uk
`;

  }

  catch(error){

    status.textContent =
      "❌ Fel";

    status.className =
      "bad";

    result.textContent =
      "Kunde inte köra backtest.\n\n" +
      (error.message || error);

  }

  finally{

    button.disabled = false;

  }

}

</script>

</body>
</html>
